<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telsiz v12 (TR Destekli)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #screen-login { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 20px; z-index: 10; background: #000; }
        input { padding: 15px; width: 80%; margin: 10px auto; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 20px; text-align: center; }
        button.btn-main { padding: 15px; width: 90%; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; font-weight: bold; }
        
        /* TELSİZ EKRANI */
        #screen-radio { display: none; flex-direction: column; height: 100%; }
        
        /* BİLGİ ÇUBUĞU */
        .top-bar { padding: 10px; background: #222; border-bottom: 1px solid #444; }
        #my-full-id { color: #00ffcc; font-weight: bold; font-size: 14px; }
        
        /* VİDEO IZGARASI */
        .video-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 10px; flex-grow: 1;
        }
        .video-box {
            width: 30%; height: 120px; background: #000; border-radius: 8px; position: relative; overflow: hidden; border: 2px solid #333;
        }
        @media (max-width: 600px) { .video-box { width: 45%; height: 150px; } }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .label { position: absolute; bottom: 2px; left: 2px; font-size: 10px; background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 3px; }
        
        /* Yeşil Işık Efekti */
        .video-box.talking { border-color: #0f0; box-shadow: 0 0 15px #0f0; }
        .video-box.me { border-color: #00aaff; }

        /* BUTON */
        .ptt-wrapper { height: 220px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; border-top: 1px solid #333; }
        #btn-ptt {
            width: 160px; height: 160px; border-radius: 50%;
            background: #333; border: 6px solid #444;
            color: #aaa; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        #btn-ptt.active { background: #d00; color: white; border-color: #f00; box-shadow: 0 0 40px #d00; }
    </style>
</head>
<body>

    <div id="screen-login">
        <h2>Telsiz v12</h2>
        <p style="color:#aaa;">Oda ismi girin (Örn: ekip)</p>
        <input type="text" id="inp-room" placeholder="Oda Adı">
        <div style="font-size:12px; color:#888; margin-bottom:10px;">Türkçe karakterler otomatik düzeltilir.</div>
        <button class="btn-main" onclick="baslat()">BAĞLAN</button>
    </div>

    <div id="screen-radio">
        <div class="top-bar">
            <div id="my-full-id">ID Oluşturuluyor...</div>
            <div id="status-txt" style="font-size:11px; color:#aaa; margin-top:3px;">Bağlantı bekleniyor...</div>
        </div>
        
        <div class="video-container">
            <div class="video-box" id="box-1"><video id="v-1" autoplay playsinline></video><span class="label">1</span></div>
            <div class="video-box" id="box-2"><video id="v-2" autoplay playsinline></video><span class="label">2</span></div>
            <div class="video-box" id="box-3"><video id="v-3" autoplay playsinline></video><span class="label">3</span></div>
            <div class="video-box" id="box-4"><video id="v-4" autoplay playsinline></video><span class="label">4</span></div>
            <div class="video-box" id="box-5"><video id="v-5" autoplay playsinline></video><span class="label">5</span></div>
        </div>

        <div class="ptt-wrapper">
            <div id="btn-ptt">BAŞLATILIYOR</div>
        </div>
    </div>

    <script>
        var peer = null;
        var localStream = null;
        var mySlot = 0;
        var myRoom = "";
        var connections = {};

        // Türkçe Karakter Düzeltici
        function turkceTemizle(text) {
            var trMap = {
                'çÇ':'c', 'ğĞ':'g', 'şŞ':'s', 'üÜ':'u', 'ıİ':'i', 'öÖ':'o'
            };
            for(var key in trMap) {
                text = text.replace(new RegExp('['+key+']','g'), trMap[key]);
            }
            return text.replace(/[^a-z0-9]/g, ''); // Sadece harf ve rakam kalsın
        }

        function baslat() {
            var rawVal = document.getElementById('inp-room').value.toLowerCase();
            if(!rawVal) { alert("Oda adı yazın!"); return; }
            
            // Türkçe karakterleri düzelt
            myRoom = turkceTemizle(rawVal);
            
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-radio').style.display = 'flex';
            
            // Kullanıcıya temizlenmiş oda adını gösterelim ki hata varsa anlasın
            document.getElementById('status-txt').innerText = "Oda kodu: " + myRoom;

            navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 320, height: 240, facingMode: "user" } })
            .then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                butonKurulumu();
                yerBul(1);
            }).catch(function(err) {
                alert("Kamera izni vermediniz!");
                location.reload();
            });
        }

        function yerBul(no) {
            if(no > 5) { alert("Oda dolu! Başka isim deneyin."); location.reload(); return; }
            
            document.getElementById('status-txt').innerText = "Koltuk #" + no + " deneniyor...";
            
            try {
                var tempId = myRoom + "_" + no;
                var tempPeer = new Peer(tempId);
            } catch (e) { return; }

            tempPeer.on('open', function(id) {
                mySlot = no;
                peer = tempPeer;
                
                // EKRANA KOCAMAN ID YAZ (Kontrol için)
                document.getElementById('my-full-id').innerText = "BENİM ID: " + id;
                document.getElementById('status-txt').innerText = "Bağlandı.";
                
                // Kendi videomuzu yerleştirelim
                var v = document.getElementById('v-' + no);
                v.srcObject = localStream;
                v.muted = true;
                document.getElementById('box-' + no).classList.add('me');

                dinlemeyeBasla();
                digerleriniAra();
                
                var btn = document.getElementById('btn-ptt');
                btn.innerText = "BAS KONUŞ";
                btn.style.color = "white";
            });

            tempPeer.on('error', function(err) {
                if(err.type === 'unavailable-id') {
                    tempPeer.destroy();
                    yerBul(no + 1); // Doluysa sonrakine geç
                }
            });
        }

        function dinlemeyeBasla() {
            peer.on('call', function(call) {
                call.answer(localStream);
                videoBagla(call);
            });
        }

        function digerleriniAra() {
            if(!peer) return;
            for(var i=1; i<=5; i++) {
                if(i === mySlot) continue;
                var target = myRoom + "_" + i;
                if(!connections[target]) {
                    try {
                        var call = peer.call(target, localStream);
                        if(call) videoBagla(call, i);
                    } catch(e) {}
                }
            }
            setTimeout(digerleriniAra, 4000);
        }

        function videoBagla(call, manuelNo) {
            var slot = manuelNo;
            if(!slot && call.peer) slot = parseInt(call.peer.split('_').pop());

            call.on('stream', function(rs) {
                if(!connections[call.peer]) {
                    var v = document.getElementById('v-' + slot);
                    var b = document.getElementById('box-' + slot);
                    if(v) {
                        v.srcObject = rs;
                        sesAnaliziYap(rs, b);
                    }
                    connections[call.peer] = true;
                }
            });
            call.on('close', function() {
                delete connections[call.peer];
                var v = document.getElementById('v-' + slot);
                if(v) v.srcObject = null;
            });
            call.on('error', function(e){});
        }

        function sesAnaliziYap(stream, box) {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var src = ctx.createMediaStreamSource(stream);
                var anl = ctx.createAnalyser();
                anl.fftSize = 32;
                src.connect(anl);
                var data = new Uint8Array(anl.frequencyBinCount);
                
                function loop() {
                    anl.getByteFrequencyData(data);
                    var sum = 0;
                    for(var i=0; i<data.length; i++) sum += data[i];
                    if((sum/data.length) > 10) box.classList.add('talking');
                    else box.classList.remove('talking');
                    requestAnimationFrame(loop);
                }
                loop();
            } catch(e){}
        }

        function butonKurulumu() {
            var btn = document.getElementById('btn-ptt');
            var myBox = document.getElementById('box-' + mySlot);
            
            function bas(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = true;
                    btn.classList.add('active');
                    if(myBox) myBox.classList.add('talking');
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            }
            function cek(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    btn.classList.remove('active');
                    if(myBox) myBox.classList.remove('talking');
                }
            }
            btn.addEventListener('mousedown', bas);
            btn.addEventListener('mouseup', cek);
            btn.addEventListener('touchstart', bas, {passive:false});
            btn.addEventListener('touchend', cek, {passive:false});
        }
    </script>
</body>
</html>
