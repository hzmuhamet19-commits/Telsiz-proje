<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telsiz v8 Final</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Hata/Bilgi Kutusu */
        #debug-box {
            background: #330000; color: #ffcccc; padding: 10px; font-size: 12px;
            border-bottom: 2px solid red; text-align: left; min-height: 40px;
        }

        /* Giriş Ekranı */
        #screen-login { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 20px; }
        input { padding: 15px; width: 80%; margin: 10px auto; border-radius: 5px; border: none; font-size: 18px; text-align: center; }
        button { padding: 15px; width: 90%; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; font-weight: bold; }
        
        /* Telsiz Ekranı */
        #screen-radio { display: none; flex-direction: column; height: 100%; }
        .info-bar { padding: 10px; background: #222; }
        .lights { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
        .led { width: 15px; height: 15px; background: #444; border-radius: 50%; }
        .led.active { background: #0f0; box-shadow: 0 0 10px #0f0; }
        .led.me { border: 2px solid #00aaff; }

        .ptt-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        #btn-ptt {
            width: 250px; height: 250px; border-radius: 50%;
            background: #333; border: 5px solid #555;
            color: #aaa; font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            touch-action: manipulation;
        }
        #btn-ptt.active { background: #b00; color: white; border-color: red; }
    </style>
</head>
<body>

    <div id="debug-box">Yükleniyor... (Eğer bu yazı değişmezse kod bozuk yapıştırıldı demektir)</div>

    <div id="screen-login">
        <h2>Telsiz v8</h2>
        <p style="color:#aaa;">Bir oda adı yazın.</p>
        <input type="text" id="inp-room" placeholder="Örn: test34">
        <button id="btn-login" onclick="girisYap()">BAĞLAN</button>
        <div style="margin-top:20px; font-size:12px; color:#666;">v8 - Clean Code</div>
    </div>

    <div id="screen-radio">
        <div class="info-bar">
            <div id="txt-room" style="color:#0af;">...</div>
            <div id="txt-status" style="font-size:12px; color:#aaa;">Hazırlanıyor...</div>
            <div class="lights">
                <div id="l1" class="led"></div>
                <div id="l2" class="led"></div>
                <div id="l3" class="led"></div>
                <div id="l4" class="led"></div>
                <div id="l5" class="led"></div>
            </div>
        </div>

        <div class="ptt-area">
            <div id="btn-ptt">BAŞLATILIYOR</div>
        </div>
    </div>

    <script>
        // Hata Yakalayıcı (En başa koydum)
        window.onerror = function(msg, url, line) {
            document.getElementById('debug-box').innerHTML += "<br><strong>HATA:</strong> " + msg;
            document.getElementById('debug-box').style.backgroundColor = "#550000";
        };

        // Kodun çalıştığını teyit et
        document.getElementById('debug-box').innerText = "Sistem Hazır - Kod Çalışıyor. Oda adı girin.";
        document.getElementById('debug-box').style.backgroundColor = "#003300";
        document.getElementById('debug-box').style.color = "#ccffcc";

        // Değişkenler
        var peer;
        var localStream;
        var mySlot = 0;
        var myRoom = "";
        var connections = {};

        function log(msg) {
            document.getElementById('debug-box').innerHTML = msg;
        }

        // 1. GİRİŞ FONKSİYONU
        function girisYap() {
            var val = document.getElementById('inp-room').value.trim();
            if(!val) { alert("Oda adı boş olamaz"); return; }
            
            // Temizle
            myRoom = val.toLowerCase().replace(/[^a-z0-9]/g, '');
            
            // Ekran Değiştir
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-radio').style.display = 'flex';
            document.getElementById('txt-room').innerText = "Oda: " + myRoom;

            // Mikrofon İzni
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                
                log("Mikrofon Tamam. Sunucuya bağlanılıyor...");
                butonKur();
                yerBul(1); // 1. koltuğu dene

            }).catch(function(err) {
                log("HATA: Mikrofon izni verilmedi!");
                alert("Mikrofon izni şart!");
            });
        }

        // 2. YER BULMA (Otomatik)
        function yerBul(no) {
            if(no > 5) {
                log("Oda tamamen dolu! Başka isim deneyin.");
                alert("Oda dolu.");
                location.reload();
                return;
            }

            log("Koltuk #" + no + " kontrol ediliyor...");
            document.getElementById('txt-status').innerText = "Bağlanıyor: #" + no;

            var denemeId = myRoom + "_" + no;
            var tempPeer = new Peer(denemeId);

            tempPeer.on('open', function(id) {
                // Başarılı
                log("Bağlandı! Kimlik: #" + no);
                document.getElementById('txt-status').innerText = "Hazır: #" + no;
                
                mySlot = no;
                peer = tempPeer;
                
                // Işık yak
                var led = document.getElementById('l' + no);
                if(led) led.classList.add('me');

                aramalariDinle();
                digerleriniAra();
            });

            tempPeer.on('error', function(err) {
                if(err.type === 'unavailable-id') {
                    // Doluysa sonrakine geç
                    log("#" + no + " dolu, sıradakine geçiliyor...");
                    tempPeer.destroy();
                    yerBul(no + 1);
                } else {
                    log("Bağlantı Hatası: " + err.type);
                }
            });
        }

        // 3. İLETİŞİM
        function aramalariDinle() {
            peer.on('call', function(call) {
                call.answer(localStream);
                akisYonet(call);
            });
        }

        function digerleriniAra() {
            for(var i=1; i<=5; i++) {
                if(i === mySlot) continue;
                var hedef = myRoom + "_" + i;
                if(!connections[hedef]) {
                    var call = peer.call(hedef, localStream);
                    akisYonet(call, i);
                }
            }
            setTimeout(digerleriniAra, 4000);
        }

        function akisYonet(call, manuelNo) {
            var slot = manuelNo;
            if(!slot && call.peer) slot = parseInt(call.peer.split('_').pop());

            call.on('stream', function(remoteStream) {
                if(!connections[call.peer]) {
                    var au = new Audio();
                    au.srcObject = remoteStream;
                    au.play().catch(e => {});
                    
                    if(slot && document.getElementById('l'+slot)) {
                        document.getElementById('l'+slot).classList.add('active');
                    }
                    connections[call.peer] = true;
                }
            });

            call.on('close', function() {
                if(slot) document.getElementById('l'+slot).classList.remove('active');
                delete connections[call.peer];
            });
            call.on('error', function(){});
        }

        // 4. BUTON
        function butonKur() {
            var btn = document.getElementById('btn-ptt');
            btn.innerText = "BAS KONUŞ";
            btn.style.color = "white";

            function konus(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = true;
                    btn.classList.add('active');
                    btn.innerText = "YAYINDA";
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            }
            function sus(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    btn.classList.remove('active');
                    btn.innerText = "BAS KONUŞ";
                }
            }

            btn.addEventListener('mousedown', konus);
            btn.addEventListener('mouseup', sus);
            btn.addEventListener('mouseleave', sus);
            btn.addEventListener('touchstart', konus, {passive: false});
            btn.addEventListener('touchend', sus, {passive: false});
        }
    </script>
</body>
</html>
