<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesli Görüşme Testi</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; color: green; font-weight: bold; }
        .error { color: red; }
    </style>
</head>
<body>

    <h2>Agora Ses Testi</h2>
    <p>Aşağıdaki butona basarak odaya katılın.</p>
    
    <button id="join-btn">Konuşmaya Başla (Join)</button>
    <button id="leave-btn" disabled>Ayrıl (Leave)</button>

    <div id="status">Durum: Bekleniyor...</div>

    <script>
        // --- AYARLAR ---
        // Agora Panelinden aldığın bilgileri buraya gireceksin:
        const APP_ID = "70dad3e486194c39846e86a26911868b"; 
        const TOKEN = "b3f32630b7de4903bd42be5a63e7e44c";
        const CHANNEL_NAME = "test"; // Token oluştururken girdiğin kanal adı ile AYNI olmalı.
        // ----------------

        const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
        let localAudioTrack;

        document.getElementById("join-btn").onclick = async function () {
            try {
                // Odaya Katıl
                await client.join(APP_ID, CHANNEL_NAME, TOKEN, null);
                
                // Mikrofonu al ve yayınla
                localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                await client.publish([localAudioTrack]);

                document.getElementById("status").innerText = "Durum: Bağlandı! Ses gidiyor.";
                document.getElementById("join-btn").disabled = true;
                document.getElementById("leave-btn").disabled = false;
                
                console.log("Başarıyla bağlanıldı.");

            } catch (error) {
                console.error(error);
                document.getElementById("status").innerText = "Hata: " + error.code + " - " + error.message;
                document.getElementById("status").className = "error";
            }
        };

        document.getElementById("leave-btn").onclick = async function () {
            // Yayını durdur ve çık
            localAudioTrack.close();
            await client.leave();
            
            document.getElementById("status").innerText = "Durum: Ayrıldı.";
            document.getElementById("join-btn").disabled = false;
            document.getElementById("leave-btn").disabled = true;
        };

        // Başka biri katıldığında sesini çal
        client.on("user-published", async (user, mediaType) => {
            await client.subscribe(user, mediaType);
            if (mediaType === "audio") {
                const remoteAudioTrack = user.audioTrack;
                remoteAudioTrack.play();
                console.log("Karşı tarafın sesi geliyor.");
            }
        });
    </script>
</body>
</html>
