<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Telsiz v19 (0 Gecikme)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b141a;
            --item-color: #202c33;
            --green-accent: #00a884;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            font-family: 'Roboto', sans-serif; 
            margin: 0; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; 
        }

        /* GİRİŞ EKRANI */
        #login-panel { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100%; padding: 20px; z-index: 10; background: var(--bg-color);
        }

        input { 
            background: var(--item-color); color: white; border: 1px solid #333; 
            padding: 15px; width: 100%; max-width: 250px; 
            border-radius: 10px; text-align: center; font-size: 18px; 
            margin-bottom: 30px;
        }

        .user-select { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 300px; 
        }
        
        .btn-user { 
            background: var(--item-color); color: var(--text-secondary); 
            padding: 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);
            font-weight: bold; cursor: pointer; text-align: center;
        }
        .btn-user:active { background: var(--green-accent); color: white; }

        /* TELSİZ EKRANI */
        #radio-panel { display: none; flex-direction: column; height: 100%; }

        .app-bar {
            background: var(--item-color); padding: 10px 15px; 
            display: flex; align-items: center; justify-content: space-between;
            height: 55px; border-bottom: 1px solid #333;
        }

        .user-list {
            flex-grow: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }

        .user-row {
            display: flex; align-items: center; 
            padding: 8px; border-radius: 8px;
            background: rgba(255,255,255,0.02);
        }
        
        .avatar-wrapper {
            width: 50px; height: 50px; border-radius: 50%; 
            overflow: hidden; background: #000; flex-shrink: 0;
            border: 2px solid #333; position: relative;
        }
        
        /* PİKSELLEŞTİRME HİLESİ: Görüntüyü netleştirme, bırak pikselli kalsın, daha hızlı işlenir */
        video { 
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); 
            image-rendering: pixelated; 
        }

        .user-info { margin-left: 12px; flex-grow: 1; }
        .u-name { font-weight: bold; font-size: 15px; color: var(--text-primary); }
        .u-status { font-size: 12px; color: var(--text-secondary); }

        .user-row.talking .avatar-wrapper { border-color: var(--green-accent); }
        .user-row.talking .u-name { color: var(--green-accent); }
        .user-row.talking .u-status { color: var(--green-accent); }
        .user-row.me .avatar-wrapper { border-color: #0088cc; } 

        .bottom-bar {
            background: var(--item-color); height: 130px; 
            display: flex; align-items: center; justify-content: center;
            border-top: 1px solid #333; position: relative;
        }

        #mic-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--green-accent); 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer; user-select: none;
            transition: transform 0.05s;
        }
        
        .mic-icon { font-size: 35px; color: white; }

        #mic-btn.active { 
            transform: scale(1.1); background: #00ffaa; 
            box-shadow: 0 0 20px #00ffaa;
        }
        
        .status-pill {
            position: absolute; top: -25px; background: #000; 
            padding: 4px 12px; border-radius: 20px; font-size: 11px;
            opacity: 0.9; display: none; color: #0f0;
        }
    </style>
</head>
<body>

    <div id="login-panel">
        <h3 style="color:var(--green-accent);">Turbo Telsiz</h3>
        <p style="color:#666; font-size:12px;">Grup İsmi:</p>
        <input type="text" id="room-input" placeholder="Grup">
        <p style="color:#666; font-size:12px;">Numaranı Seç:</p>
        <div class="user-select">
            <div class="btn-user" onclick="sec(1)">1</div>
            <div class="btn-user" onclick="sec(2)">2</div>
            <div class="btn-user" onclick="sec(3)">3</div>
            <div class="btn-user" onclick="sec(4)">4</div>
        </div>
        <div style="font-size:10px; color:#444; margin-top:20px;">Ultra Low Latency Mode</div>
    </div>

    <div id="radio-panel">
        <div class="app-bar">
            <div style="font-weight:bold;">Grup: <span id="header-title" style="color:var(--green-accent)">...</span></div>
            <div style="font-size:12px; color:#666;" id="header-room">#</div>
        </div>

        <div class="user-list">
            <div class="user-row" id="row-1">
                <div class="avatar-wrapper"><video id="v-1" autoplay playsinline></video></div>
                <div class="user-info"><div class="u-name">1. Kişi</div><div class="u-status" id="st-1">...</div></div>
            </div>
            <div class="user-row" id="row-2">
                <div class="avatar-wrapper"><video id="v-2" autoplay playsinline></video></div>
                <div class="user-info"><div class="u-name">2. Kişi</div><div class="u-status" id="st-2">...</div></div>
            </div>
            <div class="user-row" id="row-3">
                <div class="avatar-wrapper"><video id="v-3" autoplay playsinline></video></div>
                <div class="user-info"><div class="u-name">3. Kişi</div><div class="u-status" id="st-3">...</div></div>
            </div>
            <div class="user-row" id="row-4">
                <div class="avatar-wrapper"><video id="v-4" autoplay playsinline></video></div>
                <div class="user-info"><div class="u-name">4. Kişi</div><div class="u-status" id="st-4">...</div></div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="status-pill" id="status-pill">CANLI YAYINDA</div>
            <div id="mic-btn"><div class="mic-icon">🎙</div></div>
        </div>
    </div>

    <script>
        var peer, localStream, mySlot, myRoom;
        var conns = {};

        function sec(no) {
            var inputVal = document.getElementById('room-input').value;
            if(!inputVal) inputVal = "test"; 

            myRoom = inputVal.toLowerCase().replace(/[^a-z0-9]/g, '');
            mySlot = no;

            // --- HIZ AYARLARI (TURBO MOD) ---
            // width: 150 -> Profil resmi kadar küçük (Veri tasarrufu MAX)
            // frameRate: 10 -> Saniyede 10 kare (Az veri, hızlı iletim)
            var constraints = {
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                    latency: 0 // Mümkün olan en düşük ses gecikmesi
                },
                video: { width: 150, height: 150, frameRate: 10, facingMode: "user" }
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('radio-panel').style.display = 'flex';
                
                document.getElementById('header-title').innerText = inputVal;
                document.getElementById('header-room').innerText = "#" + mySlot;

                baslatPeer();
                butonAyarla();
            })
            .catch(function(err) {
                alert("Hata: " + err);
                location.reload();
            });
        }

        function baslatPeer() {
            var id = myRoom + "_" + mySlot;
            // PeerConfig: Google'ın hızlı STUN sunucularını kullan
            peer = new Peer(id, { 
                debug: 0,
                config: {'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]}
            });

            peer.on('open', function() {
                var v = document.getElementById('v-' + mySlot);
                v.srcObject = localStream;
                v.muted = true; // Kendimizi duymayalım
                
                document.getElementById('row-' + mySlot).classList.add('me');
                document.getElementById('st-' + mySlot).innerText = "Sen";
                document.getElementById('st-' + mySlot).style.color = "#0088cc";

                peer.on('call', function(c) { c.answer(localStream); bagla(c); });
                ara();
            });

            peer.on('error', function(err) {
                if(err.type == 'unavailable-id') {
                    alert("Bu numara dolu!");
                    location.reload();
                }
            });
        }

        function ara() {
            for(var i=1; i<=4; i++) {
                if(i == mySlot) continue;
                var target = myRoom + "_" + i;
                if(!conns[target]) {
                    try { var c = peer.call(target, localStream); if(c) bagla(c, i); } catch(e){}
                }
            }
            // Taramayı sıklaştır (Hızlı bulsun)
            setTimeout(ara, 3000); 
        }

        function bagla(call, manuelNo) {
            var slot = manuelNo;
            if(!slot && call.peer) slot = parseInt(call.peer.split('_').pop());

            call.on('stream', function(rs) {
                if(!conns[call.peer]) {
                    var v = document.getElementById('v-' + slot);
                    if(v) { 
                        v.srcObject = rs; 
                        v.muted = false; // SESİ AÇ
                        v.play().catch(e => console.log(e));
                        sesAnaliz(rs, slot);
                        document.getElementById('st-' + slot).innerText = "Bağlandı";
                    }
                    conns[call.peer] = true;
                }
            });
            
            call.on('close', function() { 
                delete conns[call.peer]; 
                document.getElementById('st-' + slot).innerText = "Koptu...";
                var v = document.getElementById('v-' + slot);
                if(v) v.srcObject = null;
            });
            call.on('error', function(){});
        }

        function sesAnaliz(stream, slotNum) {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var src = ctx.createMediaStreamSource(stream);
                var anl = ctx.createAnalyser();
                anl.fftSize = 32;
                src.connect(anl);
                var data = new Uint8Array(anl.frequencyBinCount);
                
                var row = document.getElementById('row-' + slotNum);
                var st = document.getElementById('st-' + slotNum);

                function loop() {
                    if(!row) return;
                    anl.getByteFrequencyData(data);
                    var sum = 0;
                    for(var i=0; i<data.length; i++) sum += data[i];
                    
                    if((sum/data.length)>10) {
                        row.classList.add('talking');
                        st.innerText = "Konuşuyor...";
                        st.style.color = "#00a884";
                    } else {
                        row.classList.remove('talking');
                        st.innerText = "Bağlı";
                        st.style.color = "#8696a0";
                    }
                    requestAnimationFrame(loop);
                }
                loop();
            }catch(e){}
        }

        function butonAyarla() {
            var btn = document.getElementById('mic-btn');
            var pill = document.getElementById('status-pill');
            var myRow = document.getElementById('row-' + mySlot);
            
            function bas(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = true;
                    btn.classList.add('active');
                    pill.style.display = 'block';
                    myRow.classList.add('talking');
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            }
            function cek(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    btn.classList.remove('active');
                    pill.style.display = 'none';
                    myRow.classList.remove('talking');
                }
            }
            btn.addEventListener('mousedown', bas);
            btn.addEventListener('mouseup', cek);
            btn.addEventListener('touchstart', bas, {passive:false});
            btn.addEventListener('touchend', cek, {passive:false});
        }
    </script>
</body>
</html>
