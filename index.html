<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Telsiz</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* CSS TASARIMI */
        body { margin: 0; background-color: #121212; color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #giris-ekrani { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; position: absolute; background: #121212; z-index: 10; }
        .kutu { background: #1e1e1e; padding: 25px; border-radius: 15px; width: 85%; max-width: 350px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 90%; padding: 15px; margin: 15px 0; background: #333; border: 1px solid #444; color: white; border-radius: 8px; font-size: 18px; text-align: center; }
        .btn-giris { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-giris:active { transform: scale(0.98); }

        /* TELSİZ EKRANI */
        #telsiz-ekrani { display: none; flex-direction: column; height: 100%; }
        .bilgi-bar { padding: 15px; background: #1a1a1a; text-align: center; border-bottom: 1px solid #333; }
        .kullanici-listesi { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .k-ikon { width: 30px; height: 30px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; color: #777; }
        .k-ikon.aktif { background: #28a745; color: white; box-shadow: 0 0 10px #28a745; }
        .k-ikon.ben { border: 2px solid #007bff; }

        .orta-alan { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        
        /* PTT BUTONU */
        #btn-konus {
            width: 70vw; height: 70vw; max-width: 280px; max-height: 280px;
            border-radius: 50%; border: 8px solid #333; background: #222;
            color: #666; font-size: 22px; font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            display: flex; align-items: center; justify-content: center;
        }
        #btn-konus.basili { background: #d32f2f; color: white; border-color: #b71c1c; box-shadow: 0 0 40px #d32f2f; transform: scale(0.95); }

        #durum-yazisi { color: yellow; font-size: 14px; margin-bottom: 10px; height: 20px; }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <div class="kutu">
            <h2>Hızlı Telsiz</h2>
            <p style="color:#aaa; font-size:14px;">Oda adı girin, boş koltuğa sizi biz oturtalım.</p>
            <input type="text" id="oda-adi" placeholder="Oda Adı (Örn: test)">
            <div id="durum-yazisi"></div>
            <button class="btn-giris" onclick="otomatikBaglan()">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="telsiz-ekrani">
        <div class="bilgi-bar">
            <div id="oda-bilgisi" style="font-weight:bold; color:#00d2ff;">...</div>
            <div class="kullanici-listesi">
                <div id="k1" class="k-ikon">1</div>
                <div id="k2" class="k-ikon">2</div>
                <div id="k3" class="k-ikon">3</div>
                <div id="k4" class="k-ikon">4</div>
                <div id="k5" class="k-ikon">5</div>
            </div>
        </div>

        <div class="orta-alan">
            <div id="btn-konus">BAĞLANIYOR</div>
        </div>
        
        <div style="text-align: center; padding: 10px; color: #555; font-size: 12px;">Otomatik Atama Sistemi v1.0</div>
    </div>

    <script>
        var peer = null;
        var localStream = null;
        var myRoom = "";
        var myNo = 0;
        var connections = {};

        // 1. OTOMATİK BAĞLANMA FONKSİYONU
        function otomatikBaglan() {
            var oda = document.getElementById('oda-adi').value.trim().toLowerCase();
            if (!oda) { alert("Lütfen oda adı yazın!"); return; }

            document.getElementById('durum-yazisi').innerText = "Boş yer aranıyor...";
            
            // Sırayla 1'den 5'e kadar boş yer dene
            yerBulVeBaglan(oda, 1);
        }

        // 2. BOŞ YER BULMA MANTIĞI (Recursive)
        function yerBulVeBaglan(oda, denenenNo) {
            if (denenenNo > 5) {
                alert("Bu oda tamamen dolu! (Maksimum 5 kişi)");
                document.getElementById('durum-yazisi').innerText = "Oda Dolu.";
                return;
            }

            document.getElementById('durum-yazisi').innerText = "Numara #" + denenenNo + " deneniyor...";

            var tempId = oda + "_" + denenenNo;
            
            // Yeni bir Peer oluşturup ID'yi alıp alamadığımıza bakıyoruz
            var tempPeer = new Peer(tempId);

            tempPeer.on('open', function(id) {
                // BAŞARILI! Bu numara boşmuş, kaptık.
                console.log("Yer bulundu: " + id);
                myRoom = oda;
                myNo = denenenNo;
                peer = tempPeer; // Ana peer değişkenine ata
                
                ekraniAc(); // Telsiz ekranına geç
                telsiziBaslat(); // Sistemi kur
            });

            tempPeer.on('error', function(err) {
                // HATA! Bu numara doluymuş.
                if (err.type === 'unavailable-id') {
                    console.log(denenenNo + " dolu, bir sonrakine geçiliyor...");
                    tempPeer.destroy(); // Bunu iptal et
                    yerBulVeBaglan(oda, denenenNo + 1); // Bir sonraki numarayı dene
                } else {
                    alert("Bağlantı hatası: " + err.type);
                }
            });
        }

        function ekraniAc() {
            document.getElementById('giris-ekrani').style.display = 'none';
            document.getElementById('telsiz-ekrani').style.display = 'flex';
            document.getElementById('oda-bilgisi').innerText = "Oda: " + myRoom + " | Ben: #" + myNo;
            
            // Kendi numaramızı mavi yap
            var myIcon = document.getElementById('k' + myNo);
            if(myIcon) {
                myIcon.classList.add('ben');
                myIcon.style.backgroundColor = "#0056b3";
                myIcon.style.color = "white";
            }
        }

        function telsiziBaslat() {
            // Mikrofonu aç
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false; // Sessiz başla
                
                var btn = document.getElementById('btn-konus');
                btn.innerText = "BAS KONUŞ";
                btn.style.color = "white";
                btn.style.cursor = "pointer";
                
                butonOlaylari(btn);
                digerleriniAra(); // Odaya bizden önce girenleri bul

            }).catch(function(err) {
                alert("Mikrofon izni şart!");
            });

            // Biri bizi ararsa (Yeni gelen biri)
            peer.on('call', function(call) {
                call.answer(localStream);
                baglantiyiYonet(call);
            });
        }

        // Bizden başkaları varsa onları bul
        function digerleriniAra() {
            for (var i = 1; i <= 5; i++) {
                if (i === myNo) continue; // Kendimiz hariç
                
                var hedefId = myRoom + "_" + i;
                // Zaten bağlı değilsek ara
                if (!connections[hedefId]) {
                    var call = peer.call(hedefId, localStream);
                    baglantiyiYonet(call, i);
                }
            }
            // 5 saniyede bir odayı tekrar tara
            setTimeout(digerleriniAra, 5000);
        }

        function baglantiyiYonet(call, manuelNo) {
            var peerId = call.peer;
            var numara = manuelNo || parseInt(peerId.split('_').pop());

            call.on('stream', function(remoteStream) {
                if (!document.getElementById('ses_' + numara)) {
                    var audio = new Audio();
                    audio.id = 'ses_' + numara;
                    audio.srcObject = remoteStream;
                    audio.play().catch(e => console.log("Otomatik oynatma engellendi"));
                    
                    // Yeşil ışık yak
                    var ikon = document.getElementById('k' + numara);
                    if(ikon) ikon.classList.add('aktif');
                    
                    connections[peerId] = true;
                }
            });

            call.on('close', function() {
                var ikon = document.getElementById('k' + numara);
                if(ikon) ikon.classList.remove('aktif');
                delete connections[peerId];
                var au = document.getElementById('ses_' + numara);
                if(au) au.remove();
            });
            
            call.on('error', function() {}); 
        }

        // PTT BUTON İŞLEVLERİ
        function butonOlaylari(btn) {
            function konus(e) {
                if(e.cancelable) e.preventDefault();
                if(!localStream) return;
                localStream.getAudioTracks()[0].enabled = true;
                btn.classList.add('basili');
                btn.innerText = "YAYINDA";
                if(navigator.vibrate) navigator.vibrate(50);
            }

            function sus(e) {
                if(e.cancelable) e.preventDefault();
                if(!localStream) return;
                localStream.getAudioTracks()[0].enabled = false;
                btn.classList.remove('basili');
                btn.innerText = "BAS KONUŞ";
            }

            btn.addEventListener('mousedown', konus);
            btn.addEventListener('mouseup', sus);
            btn.addEventListener('mouseleave', sus);
            btn.addEventListener('touchstart', konus, {passive: false});
            btn.addEventListener('touchend', sus, {passive: false});
        }
    </script>
</body>
</html>
