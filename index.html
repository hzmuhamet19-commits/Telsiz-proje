<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görüntülü Telsiz v11</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #screen-login { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 20px; z-index: 10; background: #000; }
        input { padding: 15px; width: 80%; margin: 10px auto; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 20px; text-align: center; }
        button.btn-main { padding: 15px; width: 90%; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; font-weight: bold; }
        
        /* TELSİZ EKRANI */
        #screen-radio { display: none; flex-direction: column; height: 100%; }
        
        /* VİDEO IZGARASI (GRID) */
        .video-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 10px; flex-grow: 1;
        }
        
        .video-box {
            width: 30%; height: 120px; background: #222; border-radius: 8px; position: relative; overflow: hidden; border: 2px solid #444; transition: 0.2s;
        }
        
        /* Mobil için biraz daha büyük */
        @media (max-width: 600px) {
            .video-box { width: 45%; height: 150px; }
        }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* Ayna modu */ }
        
        .label { position: absolute; bottom: 2px; left: 2px; font-size: 10px; background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 3px; }

        /* Konuşurken Yanacak Yeşil Işık */
        .video-box.talking { border-color: #0f0; box-shadow: 0 0 15px #0f0; }
        .video-box.me { border-color: #00aaff; }

        /* BUTON ALANI */
        .ptt-wrapper { height: 250px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; border-top: 1px solid #333; }
        
        #btn-ptt {
            width: 180px; height: 180px; border-radius: 50%;
            background: #333; border: 6px solid #444;
            color: #aaa; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        #btn-ptt.active { background: #d00; color: white; border-color: #f00; box-shadow: 0 0 40px #d00; transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="screen-login">
        <h2>Görüntülü Telsiz</h2>
        <p style="color:#aaa;">Oda ismi girin:</p>
        <input type="text" id="inp-room" placeholder="Örn: ekip34">
        <button class="btn-main" onclick="baslat()">KAMERAYI AÇ VE BAĞLAN</button>
    </div>

    <div id="screen-radio">
        <div style="padding: 5px; font-size: 12px; color: #666;" id="txt-room">Oda: ...</div>
        
        <div class="video-container">
            <div class="video-box" id="box-1"><video id="v-1" autoplay playsinline></video><span class="label">1</span></div>
            <div class="video-box" id="box-2"><video id="v-2" autoplay playsinline></video><span class="label">2</span></div>
            <div class="video-box" id="box-3"><video id="v-3" autoplay playsinline></video><span class="label">3</span></div>
            <div class="video-box" id="box-4"><video id="v-4" autoplay playsinline></video><span class="label">4</span></div>
            <div class="video-box" id="box-5"><video id="v-5" autoplay playsinline></video><span class="label">5</span></div>
        </div>

        <div id="status-txt" style="font-size:10px; color:orange; margin-bottom:5px;">Bağlanıyor...</div>

        <div class="ptt-wrapper">
            <div id="btn-ptt">BAŞLATILIYOR</div>
        </div>
    </div>

    <script>
        var peer = null;
        var localStream = null;
        var mySlot = 0;
        var myRoom = "";
        var connections = {};

        function baslat() {
            var val = document.getElementById('inp-room').value.trim();
            if(!val) { alert("Oda adı yazın!"); return; }
            
            myRoom = val.toLowerCase().replace(/[^a-z0-9]/g, ''); 
            
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-radio').style.display = 'flex';
            document.getElementById('txt-room').innerText = "Oda: " + myRoom;

            // KAMERA VE MİKROFON İZNİ (Video: true eklendi)
            // Veri tasarrufu için düşük çözünürlük istiyoruz
            navigator.mediaDevices.getUserMedia({ 
                audio: true, 
                video: { width: 320, height: 240, facingMode: "user" } 
            }).then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false; // Ses kapalı başla
                
                butonKurulumu();
                yerBul(1);

            }).catch(function(err) {
                alert("Kamera/Mikrofon izni verilmedi!");
                location.reload();
            });
        }

        function yerBul(no) {
            if(no > 5) { alert("Oda dolu!"); location.reload(); return; }
            document.getElementById('status-txt').innerText = "Koltuk #" + no + " kontrol ediliyor...";
            
            try {
                var tempId = myRoom + "_" + no;
                var tempPeer = new Peer(tempId);
            } catch (e) { console.log(e); return; }

            tempPeer.on('open', function(id) {
                document.getElementById('status-txt').innerText = "Bağlandı: #" + no;
                mySlot = no;
                peer = tempPeer; 
                
                // Kendi görüntümüzü kutuya koyalım
                var myVideo = document.getElementById('v-' + no);
                myVideo.srcObject = localStream;
                myVideo.muted = true; // Kendimizi duymayalım
                document.getElementById('box-' + no).classList.add('me');

                dinlemeyeBasla();
                digerleriniAra();
                
                var btn = document.getElementById('btn-ptt');
                btn.innerText = "BAS KONUŞ";
                btn.style.color = "white";
            });

            tempPeer.on('error', function(err) {
                if(err.type === 'unavailable-id') {
                    tempPeer.destroy();
                    yerBul(no + 1);
                }
            });
        }

        function dinlemeyeBasla() {
            if(!peer) return;
            peer.on('call', function(call) {
                call.answer(localStream); // Gelen aramayı kendi görüntümüzle cevapla
                videoBagla(call);
            });
        }

        function digerleriniAra() {
            if(!peer || !localStream) return;
            for(var i=1; i<=5; i++) {
                if(i === mySlot) continue;
                var hedef = myRoom + "_" + i;
                if(!connections[hedef]) {
                    try {
                        var call = peer.call(hedef, localStream);
                        if(call) videoBagla(call, i);
                    } catch(e) {}
                }
            }
            setTimeout(digerleriniAra, 4000); 
        }

        function videoBagla(call, manuelNo) {
            var slot = manuelNo;
            if(!slot && call.peer) slot = parseInt(call.peer.split('_').pop());

            call.on('stream', function(remoteStream) {
                if(!connections[call.peer]) {
                    // İlgili kutuyu bul
                    var videoEl = document.getElementById('v-' + slot);
                    var boxEl = document.getElementById('box-' + slot);
                    
                    if(videoEl) {
                        videoEl.srcObject = remoteStream;
                        // Video geldiğinde siyah kutu canlanacak
                        
                        // SES ANALİZİ (Konuşuyor mu?)
                        // Bu kısım, karşı tarafın sesi gelince kutuyu yeşil yakmak için
                        sesAnaliziYap(remoteStream, boxEl);
                    }
                    connections[call.peer] = true;
                }
            });

            call.on('close', function() {
                delete connections[call.peer];
                // Görüntüyü temizle
                var videoEl = document.getElementById('v-' + slot);
                if(videoEl) videoEl.srcObject = null;
            });
        }

        // Basit Ses Algılayıcı (Görsel efekt için)
        function sesAnaliziYap(stream, boxElement) {
            try {
                var audioContext = new (window.AudioContext || window.webkitAudioContext)();
                var source = audioContext.createMediaStreamSource(stream);
                var analyser = audioContext.createAnalyser();
                analyser.fftSize = 32;
                source.connect(analyser);
                
                var dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function checkVolume() {
                    analyser.getByteFrequencyData(dataArray);
                    var sum = 0;
                    for(var i=0; i<dataArray.length; i++) sum += dataArray[i];
                    var average = sum / dataArray.length;
                    
                    // Eğer ses seviyesi belli bir eşiğin üstündeyse "talking" sınıfı ekle
                    if(average > 10) {
                        boxElement.classList.add('talking');
                    } else {
                        boxElement.classList.remove('talking');
                    }
                    requestAnimationFrame(checkVolume);
                }
                checkVolume();
            } catch(e) { console.log("AudioContext hatası (önemsiz)"); }
        }

        function butonKurulumu() {
            var btn = document.getElementById('btn-ptt');
            var myBox = document.getElementById('box-' + mySlot);
            
            function bas(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream && localStream.getAudioTracks().length > 0) {
                    localStream.getAudioTracks()[0].enabled = true; // Sesi aç
                    btn.classList.add('active');
                    if(myBox) myBox.classList.add('talking'); // Kendi kutunu yak
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            }
            
            function cek(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream && localStream.getAudioTracks().length > 0) {
                    localStream.getAudioTracks()[0].enabled = false; // Sesi kapat
                    btn.classList.remove('active');
                    if(myBox) myBox.classList.remove('talking'); // Kendi kutunu söndür
                }
            }

            btn.addEventListener('mousedown', bas);
            btn.addEventListener('mouseup', cek);
            btn.addEventListener('mouseleave', cek);
            btn.addEventListener('touchstart', bas, {passive: false});
            btn.addEventListener('touchend', cek, {passive: false});
        }
    </script>
</body>
</html>
