<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agora Ses Testi (Kolay Mod)</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        label { font-weight: bold; display: block; text-align: left; margin-left: 5%; }
        button { padding: 12px 30px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; width: 45%; }
        #join-btn { background-color: #28a745; }
        #leave-btn { background-color: #dc3545; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; padding: 10px; }
        .error-log { color: red; font-size: 12px; text-align: left; background: #ffe6e6; padding: 10px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Agora Ses Paneli</h2>
    
    <label>App ID:</label>
    <input type="text" id="appid" placeholder="App ID'yi buraya yapıştır">

    <label>Token:</label>
    <input type="text" id="token" placeholder="Uzun Token kodunu buraya yapıştır">

    <label>Kanal Adı:</label>
    <input type="text" id="channel" value="test" placeholder="Kanal adı (örn: test)">

    <br>
    <button id="join-btn">BAĞLAN 📞</button>
    <button id="leave-btn" disabled>AYRIL ❌</button>

    <div id="status">Durum: Bilgileri girip bağlanın.</div>
    <div id="debug-log" class="error-log"></div>
</div>

<script>
    const client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let localAudioTrack;

    document.getElementById("join-btn").onclick = async function () {
        // Kutucuklardan verileri al
        const appId = document.getElementById("appid").value.trim();
        const token = document.getElementById("token").value.trim();
        const channel = document.getElementById("channel").value.trim();

        if (!appId || !token || !channel) {
            alert("Lütfen tüm alanları doldurun!");
            return;
        }

        document.getElementById("join-btn").disabled = true;
        document.getElementById("status").innerText = "Bağlanılıyor...";

        try {
            // Odaya Katıl
            await client.join(appId, channel, token, null);
            
            // Mikrofonu Aç
            localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
            await client.publish([localAudioTrack]);

            // Başarılı
            document.getElementById("status").innerText = "✅ BAĞLANDI! Ses gidiyor.";
            document.getElementById("status").style.color = "green";
            document.getElementById("leave-btn").disabled = false;
            document.getElementById("debug-log").style.display = "none";

        } catch (error) {
            console.error(error);
            document.getElementById("status").innerText = "❌ HATA OLUŞTU";
            document.getElementById("status").style.color = "red";
            document.getElementById("join-btn").disabled = false;
            
            // Hatayı ekrana bas
            const debugDiv = document.getElementById("debug-log");
            debugDiv.style.display = "block";
            debugDiv.innerText = "Hata Detayı:\n" + error.message;

            if(error.code === "INVALID_TOKEN") {
                alert("Token geçersiz! Lütfen kopyalarken tam aldığından emin ol.");
            }
        }
    };

    document.getElementById("leave-btn").onclick = async function () {
        if (localAudioTrack) {
            localAudioTrack.close();
            localAudioTrack = null;
        }
        await client.leave();
        
        document.getElementById("status").innerText = "🔴 Ayrıldı.";
        document.getElementById("status").style.color = "black";
        document.getElementById("join-btn").disabled = false;
        document.getElementById("leave-btn").disabled = true;
    };

    // Karşı taraf gelince sesi çal
    client.on("user-published", async (user, mediaType) => {
        await client.subscribe(user, mediaType);
        if (mediaType === "audio") {
            user.audioTrack.play();
            document.getElementById("status").innerText = "🗣️ Karşı tarafın sesi geliyor!";
        }
    });
    
    client.on("user-unpublished", async (user) => {
        document.getElementById("status").innerText = "✅ Bağlı (Karşı taraf sustu/ayrıldı)";
    });

</script>

</body>
</html>
