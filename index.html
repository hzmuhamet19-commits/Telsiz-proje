<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telsiz</title>
    <script src="[https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js](https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js)"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; }
        input, select { padding: 15px; width: 80%; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
        button { cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-start { background: #007bff; color: white; padding: 15px; width: 85%; font-size: 18px; }

        /* TELSİZ EKRANI */
        #radio-screen { display: none; flex-direction: column; height: 100%; }
        .top-bar { padding: 15px; background: #333; }
        .status-lights { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
        .light { width: 30px; height: 30px; background: #555; border-radius: 50%; line-height: 30px; font-size: 12px; opacity: 0.5; }
        .light.active { background: #28a745; opacity: 1; box-shadow: 0 0 10px #28a745; }

        .center-area { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        
        /* KOCAMAN BAS KONUŞ BUTONU */
        #ptt-btn {
            width: 250px; height: 250px;
            border-radius: 50%;
            background: #444; color: #aaa;
            border: 10px solid #333;
            font-size: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none; -webkit-user-select: none; /* Telefonda seçimi engeller */
            touch-action: manipulation;
        }
        #ptt-btn.talking { background: #c0392b; color: white; border-color: #e74c3c; box-shadow: 0 0 50px #c0392b; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Telsiz Giriş</h2>
        <input type="text" id="roomName" placeholder="Oda Adı (Örn: santiye)">
        <select id="userNo">
            <option value="1">1. Kişi (Şef)</option>
            <option value="2">2. Kişi</option>
            <option value="3">3. Kişi</option>
            <option value="4">4. Kişi</option>
            <option value="5">5. Kişi</option>
        </select>
        <button class="btn-start" onclick="baslat()">BAĞLAN</button>
    </div>

    <div id="radio-screen">
        <div class="top-bar">
            <div id="info-txt">Bağlanıyor...</div>
            <div class="status-lights">
                <div id="l1" class="light">1</div>
                <div id="l2" class="light">2</div>
                <div id="l3" class="light">3</div>
                <div id="l4" class="light">4</div>
                <div id="l5" class="light">5</div>
            </div>
        </div>

        <div class="center-area">
            <button id="ptt-btn" disabled>YÜKLENİYOR</button>
        </div>
        
        <div style="padding:10px; color:#666; font-size:12px;">v3.0 - Hata Korumalı</div>
    </div>

    <script>
        // Hata yakalama
        window.onerror = function(msg, url, line) {
            alert("Hata Oluştu:\n" + msg + "\nSatır: " + line);
        };

        // Değişkenler
        var peer;
        var localStream;
        var myPeerId;
        var connections = {}; // Diğer kullanıcılarla bağlantılar
        
        // URL Parametrelerini Kontrol Et (Linkle gelindiyse)
        var params = new URLSearchParams(window.location.search);
        var urlRoom = params.get('oda');
        var urlNo = params.get('no');

        if(urlRoom && urlNo) {
            telsiziAc(urlRoom, urlNo);
        }

        // Giriş Butonuna Basılınca
        function baslat() {
            var r = document.getElementById('roomName').value.trim();
            var n = document.getElementById('userNo').value;
            if(!r) { alert("Oda adı boş olamaz!"); return; }
            
            // Sayfayı yenileyerek parametre ekle (En temiz yöntem)
            var cleanUrl = window.location.href.split('?')[0];
            window.location.href = cleanUrl + "?oda=" + r + "&no=" + n;
        }

        function telsiziAc(room, no) {
            // Ekran değiştir
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('radio-screen').style.display = 'flex';
            document.getElementById('info-txt').innerText = "Oda: " + room + " | Ben: #" + no;
            
            // Kendi ışığımızı yakalım
            document.getElementById('l' + no).style.backgroundColor = "#007bff";
            document.getElementById('l' + no).style.opacity = "1";

            // PeerJS Başlat
            myPeerId = room + "_" + no;
            peer = new Peer(myPeerId);

            // 1. Mikrofon İzni İste
            navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false; // Başta sesi kapat
                
                butonAktif();
                digerleriniAra(room, no); // Diğerlerini bulmaya başla
                
            }).catch(function(err) {
                alert("Mikrofon izni verilmedi! Telsiz çalışmaz.");
                document.getElementById('ptt-btn').innerText = "İZİN YOK";
            });

            // 2. Biri Bizi Ararsa (Bağlantı kabulü)
            peer.on('call', function(call) {
                call.answer(localStream); // Cevap ver
                baglantiyiYonet(call);
            });

            // Hata olursa
            peer.on('error', function(err) {
                console.log(err);
                if(err.type === 'unavailable-id') {
                    alert("Bu numara (#" + no + ") zaten odada var! Başka numara seç.");
                    window.location.href = window.location.href.split('?')[0];
                }
            });
        }

        // Diğer kullanıcıları (1'den 5'e kadar) sürekli ara
        function digerleriniAra(room, myNo) {
            for (var i = 1; i <= 5; i++) {
                if (i == myNo) continue; // Kendini arama
                
                var targetId = room + "_" + i;
                if (!connections[targetId]) {
                    var call = peer.call(targetId, localStream);
                    baglantiyiYonet(call);
                }
            }
            // 5 saniyede bir tekrar dene (Kopan olursa veya yeni gelen olursa)
            setTimeout(function() { digerleriniAra(room, myNo); }, 5000);
        }

        function baglantiyiYonet(call) {
            var peerId = call.peer; // Örn: insaat_2
            var userNo = peerId.split('_')[1]; // 2 numarasını al

            call.on('stream', function(remoteStream) {
                // Ses etiketi oluştur (Eğer yoksa)
                if (!document.getElementById('audio_' + userNo)) {
                    var audio = new Audio();
                    audio.id = 'audio_' + userNo;
                    audio.srcObject = remoteStream;
                    audio.play().catch(e => console.log("Otomatik oynatma beklemede"));
                    
                    // Işığı yeşil yak
                    var light = document.getElementById('l' + userNo);
                    if(light) {
                        light.classList.add('active');
                        connections[peerId] = true;
                    }
                }
            });

            call.on('close', function() {
                // Bağlantı koparsa ışığı söndür
                var light = document.getElementById('l'
