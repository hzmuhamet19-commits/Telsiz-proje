<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Netlify Telsiz</title>
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.18.2.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #login-container {
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 25px;
            border: none;
            background: #333;
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        button.join-btn {
            width: 100%;
            padding: 15px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #007bff, #00d2ff);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        #radio-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            padding: 20px 0;
        }

        .header-info {
            text-align: center;
            margin-top: 20px;
        }
        .channel-badge {
            background: #333;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            color: #aaa;
        }

        .users-list {
            width: 80%;
            height: 150px;
            overflow-y: auto;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 10px;
            margin: 10px 0;
        }
        .user-row {
            display: flex;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .online-dot {
            width: 10px; height: 10px; background: #2ecc71; 
            border-radius: 50%; margin-right: 10px;
        }

        #ptt-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: #e74c3c;
            border: 8px solid #c0392b;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 50px rgba(231, 76, 60, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin-bottom: 40px;
            transition: all 0.1s;
        }
        
        #ptt-btn i { font-size: 40px; margin-bottom: 10px; }

        #ptt-btn.talking {
            background: #2ecc71;
            border-color: #27ae60;
            transform: scale(0.95);
            box-shadow: 0 0 60px rgba(46, 204, 113, 0.6);
        }

        #status-text {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div id="login-container">
        <h1 style="color: #00d2ff;"><i class="fas fa-walkie-talkie"></i> Telsiz</h1>
        <p style="color: #aaa;">Lütfen kod adınızı girin.</p>
        <input type="text" id="username" placeholder="Kod Adı / İsim" maxlength="15">
        <button class="join-btn" onclick="startApp()">BAĞLAN</button>
    </div>

    <div id="radio-container">
        <div class="header-info">
            <h2 id="display-name" style="margin:0;">Kullanıcı</h2>
            <span class="channel-badge">Kanal: GENEL</span>
        </div>

        <div class="users-list" id="users-box">
            <div style="color:#666; font-size:12px; text-align:center;">Diğer kullanıcılar bekleniyor...</div>
        </div>

        <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
            <p id="status-text">Bağlantı bekleniyor...</p>
            <button id="ptt-btn">
                <i class="fas fa-microphone"></i>
                <span>BAS KONUŞ</span>
            </button>
        </div>
    </div>
