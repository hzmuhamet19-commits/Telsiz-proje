<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wp Telsiz v17</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Helvetica+Now+Display:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        /* WHATSAPP DARK THEME RENKLERİ */
        :root {
            --bg-color: #111b21;
            --header-color: #202c33;
            --item-color: #202c33;
            --green-accent: #00a884;
            --text-primary: #e9edef;
            --text-secondary: #8696a0;
            --incoming-bubble: #202c33;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            font-family: 'Roboto', Helvetica, Arial, sans-serif; 
            margin: 0; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; 
        }

        /* GİRİŞ EKRANI */
        #login-panel { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100%; padding: 20px; z-index: 10; background: var(--bg-color);
        }

        .wp-logo {
            font-size: 60px; color: var(--green-accent); margin-bottom: 20px;
        }

        input { 
            background: var(--item-color); color: white; border: none; 
            padding: 15px; width: 100%; max-width: 300px; 
            border-radius: 20px; text-align: center; font-size: 18px; 
            margin-bottom: 30px;
        }

        .user-select { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 350px; 
        }
        
        .btn-user { 
            background: var(--item-color); color: var(--text-secondary); 
            padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-user:active { background: var(--green-accent); color: white; }

        /* TELSİZ EKRANI (LİSTE GÖRÜNÜMÜ) */
        #radio-panel { display: none; flex-direction: column; height: 100%; }

        /* Üst Bar */
        .app-bar {
            background: var(--header-color); padding: 10px 15px; 
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            height: 60px;
        }
        .app-title { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .room-tag { font-size: 12px; color: var(--text-secondary); }

        /* Kullanıcı Listesi (Chat Listesi Gibi) */
        .user-list {
            flex-grow: 1; overflow-y: auto; padding: 10px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .user-row {
            display: flex; align-items: center; 
            background: transparent; 
            padding: 5px; border-radius: 10px;
            transition: 0.3s;
        }
        
        /* Video Avatar (Yuvarlak) */
        .avatar-wrapper {
            width: 60px; height: 60px; border-radius: 50%; 
            overflow: hidden; background: #333; flex-shrink: 0;
            border: 2px solid transparent; position: relative;
        }
        
        video { 
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); 
            filter: contrast(1.1);
        }

        .user-info { margin-left: 15px; flex-grow: 1; }
        .u-name { font-weight: bold; font-size: 16px; color: var(--text-primary); }
        .u-status { font-size: 13px; color: var(--text-secondary); }

        /* Konuşunca Yanan Yeşil Halka */
        .user-row.talking .avatar-wrapper { border-color: var(--green-accent); }
        .user-row.talking .u-name { color: var(--green-accent); }
        .user-row.talking .u-status { color: var(--green-accent); font-weight: bold; }

        /* Ben (Mavi Çerçeve) */
        .user-row.me .avatar-wrapper { border-color: #00a884; } 

        /* ALT KONTROL (MİKROFON) */
        .bottom-bar {
            background: var(--header-color); height: 140px; 
            display: flex; align-items: center; justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        /* Yüzen Dev Mikrofon Butonu */
        #mic-btn {
            width: 90px; height: 90px; border-radius: 50%;
            background: var(--green-accent); 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; user-select: none;
            transition: transform 0.1s;
        }
        
        /* Mikrofon İkonu (CSS ile) */
        .mic-icon { font-size: 40px; color: white; }

        /* Basınca Efekt */
        #mic-btn.active { 
            transform: scale(1.2); 
            background: #06cf9c; 
            box-shadow: 0 0 30px rgba(0, 168, 132, 0.6);
        }
        
        .status-pill {
            position: absolute; top: -30px; background: #000; 
            padding: 5px 15px; border-radius: 20px; font-size: 12px;
            opacity: 0.8; display: none;
        }

    </style>
</head>
<body>

    <div id="login-panel">
        <div class="wp-logo">✆</div>
        <h3 style="margin-top:0;">WhatsApp Telsiz</h3>
        <p style="color:gray; font-size:12px;">Grup Adı Girin:</p>
        
        <input type="text" id="room-input" placeholder="Grup Adı (Örn: aile)">
        
        <p style="color:gray; font-size:12px;">Kişi Seç:</p>
        <div class="user-select">
            <div class="btn-user" onclick="sec(1)">1. Kişi</div>
            <div class="btn-user" onclick="sec(2)">2. Kişi</div>
            <div class="btn-user" onclick="sec(3)">3. Kişi</div>
            <div class="btn-user" onclick="sec(4)">4. Kişi</div>
        </div>
    </div>

    <div id="radio-panel">
        <div class="app-bar">
            <div class="app-title">
                <span style="color:var(--green-accent);">✆</span> 
                <span id="header-title">Grup</span>
            </div>
            <div class="room-tag" id="header-room">...</div>
            <div style="font-size:20px; cursor:pointer;" onclick="location.reload()">⋮</div>
        </div>

        <div class="user-list">
            
            <div class="user-row" id="row-1">
                <div class="avatar-wrapper"><video id="v-1" autoplay playsinline muted></video></div>
                <div class="user-info">
                    <div class="u-name">1. Kişi</div>
                    <div class="u-status" id="st-1">Bağlantı bekleniyor...</div>
                </div>
            </div>

            <div class="user-row" id="row-2">
                <div class="avatar-wrapper"><video id="v-2" autoplay playsinline muted></video></div>
                <div class="user-info">
                    <div class="u-name">2. Kişi</div>
                    <div class="u-status" id="st-2">Bağlantı bekleniyor...</div>
                </div>
            </div>

            <div class="user-row" id="row-3">
                <div class="avatar-wrapper"><video id="v-3" autoplay playsinline muted></video></div>
                <div class="user-info">
                    <div class="u-name">3. Kişi</div>
                    <div class="u-status" id="st-3">Bağlantı bekleniyor...</div>
                </div>
            </div>

            <div class="user-row" id="row-4">
                <div class="avatar-wrapper"><video id="v-4" autoplay playsinline muted></video></div>
                <div class="user-info">
                    <div class="u-name">4. Kişi</div>
                    <div class="u-status" id="st-4">Bağlantı bekleniyor...</div>
                </div>
            </div>

        </div>

        <div class="bottom-bar">
            <div class="status-pill" id="status-pill">SES GÖNDERİLİYOR...</div>
            <div id="mic-btn">
                <div class="mic-icon">🎙</div>
            </div>
        </div>
    </div>

    <script>
        var peer, localStream, mySlot, myRoom;
        var conns = {};

        function sec(no) {
            var inputVal = document.getElementById('room-input').value;
            if(!inputVal) inputVal = "test"; 

            myRoom = inputVal.toLowerCase().replace(/[^a-z0-9]/g, '');
            mySlot = no;

            // DONMAMA GARANTİSİ: Çok düşük veri modunda açıyoruz
            // WhatsApp'taki küçük daire video için 150px kalite yeterli.
            var constraints = {
                audio: true,
                video: { width: 200, height: 200, frameRate: 15, facingMode: "user" }
            };

            navigator.mediaDevices.getUserMedia(constraints)
            .then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('radio-panel').style.display = 'flex';
                
                document.getElementById('header-title').innerText = "Grup: " + inputVal;
                document.getElementById('header-room').innerText = "#" + mySlot;

                baslatPeer();
                butonAyarla();
            })
            .catch(function(err) {
                alert("Kamera hatası: " + err);
                location.reload();
            });
        }

        function baslatPeer() {
            var id = myRoom + "_" + mySlot;
            peer = new Peer(id, { debug: 0 });

            peer.on('open', function() {
                // Kendi videomuzu yerleştir
                var v = document.getElementById('v-' + mySlot);
                v.srcObject = localStream;
                
                // Kendi satırımızı işaretle
                document.getElementById('row-' + mySlot).classList.add('me');
                document.getElementById('st-' + mySlot).innerText = "Çevrimiçi (Sen)";
                document.getElementById('st-' + mySlot).style.color = "#00a884";

                peer.on('call', function(c) { c.answer(localStream); bagla(c); });
                ara();
            });

            peer.on('error', function(err) {
                if(err.type == 'unavailable-id') {
                    alert("Bu kişi zaten seçilmiş! Başkasını seç.");
                    location.reload();
                }
            });
        }

        function ara() {
            for(var i=1; i<=4; i++) {
                if(i == mySlot) continue;
                var target = myRoom + "_" + i;
                if(!conns[target]) {
                    try { var c = peer.call(target, localStream); if(c) bagla(c, i); } catch(e){}
                }
            }
            setTimeout(ara, 4000); 
        }

        function bagla(call, manuelNo) {
            var slot = manuelNo;
            if(!slot && call.peer) slot = parseInt(call.peer.split('_').pop());

            call.on('stream', function(rs) {
                if(!conns[call.peer]) {
                    var v = document.getElementById('v-' + slot);
                    if(v) { 
                        v.srcObject = rs; 
                        sesAnaliz(rs, slot);
                        document.getElementById('st-' + slot).innerText = "Çevrimiçi";
                    }
                    conns[call.peer] = true;
                }
            });
            call.on('close', function() { 
                delete conns[call.peer]; 
                document.getElementById('st-' + slot).innerText = "Bağlantı koptu...";
            });
            call.on('error', function(){});
        }

        function sesAnaliz(stream, slotNum) {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var src = ctx.createMediaStreamSource(stream);
                var anl = ctx.createAnalyser();
                anl.fftSize = 32;
                src.connect(anl);
                var data = new Uint8Array(anl.frequencyBinCount);
                
                var row = document.getElementById('row-' + slotNum);
                var st = document.getElementById('st-' + slotNum);

                function loop() {
                    if(!row) return;
                    anl.getByteFrequencyData(data);
                    var sum = 0;
                    for(var i=0; i<data.length; i++) sum += data[i];
                    
                    if((sum/data.length)>10) {
                        row.classList.add('talking');
                        st.innerText = "Konuşuyor...";
                    } else {
                        row.classList.remove('talking');
                        st.innerText = "Çevrimiçi";
                    }
                    requestAnimationFrame(loop);
                }
                loop();
            }catch(e){}
        }

        function butonAyarla() {
            var btn = document.getElementById('mic-btn');
            var pill = document.getElementById('status-pill');
            var myRow = document.getElementById('row-' + mySlot);
            var mySt = document.getElementById('st-' + mySlot);
            
            function bas(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = true;
                    btn.classList.add('active');
                    pill.style.display = 'block';
                    myRow.classList.add('talking');
                    mySt.innerText = "Konuşuyorsun...";
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            }
            function cek(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    btn.classList.remove('active');
                    pill.style.display = 'none';
                    myRow.classList.remove('talking');
                    mySt.innerText = "Çevrimiçi (Sen)";
                }
            }
            btn.addEventListener('mousedown', bas);
            btn.addEventListener('mouseup', cek);
            btn.addEventListener('touchstart', bas, {passive:false});
            btn.addEventListener('touchend', cek, {passive:false});
        }
    </script>
</body>
</html>
