<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Telsiz</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background-color: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; text-align: center; }
        
        /* Giriş Ekranı */
        #page-login { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 20px; }
        .input-group { margin: 10px 0; }
        input { padding: 15px; width: 80%; background: #222; border: 1px solid #555; color: white; border-radius: 5px; font-size: 18px; text-align: center; }
        button { padding: 15px 30px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; width: 80%; font-weight: bold; }
        
        /* Telsiz Ekranı */
        #page-radio { display: none; flex-direction: column; height: 100%; }
        .top-info { padding: 15px; background: #111; border-bottom: 1px solid #333; }
        #status-log { font-size: 12px; color: #ffeb3b; min-height: 20px; margin-top: 5px; }
        
        .ptt-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        #ptt-btn {
            width: 70vw; height: 70vw; max-width: 300px; max-height: 300px;
            border-radius: 50%; background: #222; border: 6px solid #444;
            color: #666; font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #ptt-btn.active { background: #c00; color: white; border-color: #f00; box-shadow: 0 0 50px #c00; transform: scale(0.95); }
        
        .conn-list { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
        .dot { width: 10px; height: 10px; background: #333; border-radius: 50%; }
        .dot.on { background: #0f0; box-shadow: 0 0 5px #0f0; }
    </style>
</head>
<body>

    <div id="page-login">
        <h2>Telsiz v5</h2>
        <p style="color:#aaa;">Oda ismi belirleyin.</p>
        <div class="input-group">
            <input type="text" id="roomInput" placeholder="Örn: insaat_34">
        </div>
        <button onclick="startApp()">GİRİŞ YAP</button>
        <p style="font-size:12px; color:#666; margin-top:20px;">
            Önemli: "insaat" gibi basit isimler kullanmayın.<br>
            Benzersiz bir isim yazın.
        </p>
    </div>

    <div id="page-radio">
        <div class="top-info">
            <div id="room-name" style="color:#0af; font-weight:bold;">...</div>
            <div id="status-log">Bağlanıyor...</div>
            <div class="conn-list">
                <div id="u1" class="dot"></div>
                <div id="u2" class="dot"></div>
                <div id="u3" class="dot"></div>
                <div id="u4" class="dot"></div>
                <div id="u5" class="dot"></div>
            </div>
        </div>

        <div class="ptt-wrapper">
            <div id="ptt-btn">BAŞLATILIYOR</div>
        </div>
    </div>

    <script>
        let peer;
        let localStream;
        let myId;
        let myRoom;
        let connections = {};

        function startApp() {
            const r = document.getElementById('roomInput').value.trim();
            if(!r) return alert("Oda ismi girin!");
            
            // Oda ismini temizle
            myRoom = r.replace(/[^a-zA-Z0-9]/g, ''); 
            
            document.getElementById('page-login').style.display = 'none';
            document.getElementById('page-radio').style.display = 'flex';
            document.getElementById('room-name').innerText = "Oda: " + myRoom;

            // Mikrofonu al, sonra bağlan
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                
                setupButton();
                
                // 1. Koltuktan itibaren dene
                tryToJoin(1);

            }).catch(err => {
                alert("Mikrofon izni verilmedi!");
                document.getElementById('status-log').innerText = "Hata: Mikrofon izni yok.";
            });
        }

        // AKILLI BAĞLANTI (Unavailable Hatasını Çözen Kısım)
        function tryToJoin(slotNumber) {
            if(slotNumber > 10) { // 10 kere denediysek pes etmeyelim, rastgele girelim
                joinAsGuest(); 
                return;
            }

            document.getElementById('status-log').innerText = "Koltuk #" + slotNumber + " deneniyor...";
            
            const attemptId = myRoom + "_" + slotNumber;
            
            // Geçici Peer oluştur
            // Eğer ID doluysa 'error' fırlatır, boşsa 'open' olur.
            const tempPeer = new Peer(attemptId);

            tempPeer.on('open', (id) => {
                // BAŞARILI! Koltuk boşmuş, yerleştik.
                myId = id;
                peer = tempPeer;
                document.getElementById('status-log').innerText = "Bağlandı: #" + slotNumber;
                
                // Işığı yak
                updateDots(slotNumber);
                
                // Odayı dinlemeye başla
                startListening();
                
                // Diğerlerini ara
                connectToOthers(slotNumber);
            });

            tempPeer.on('error', (err) => {
                // HATA! Koltuk dolu (Unavailable).
                if(err.type === 'unavailable-id') {
                    console.log(slotNumber + " dolu, sonraki deneniyor...");
                    tempPeer.destroy(); // Temizle
                    setTimeout(() => tryToJoin(slotNumber + 1), 200); // 2. koltuğu dene
                } else {
                    document.getElementById('status-log').innerText = "Hata: " + err.type;
                }
            });
        }

        function joinAsGuest() {
            // Eğer her yer doluysa rastgele isimle gir
            const rnd = Math.floor(Math.random()*1000);
            const guestId = myRoom + "guest" + rnd;
            peer = new Peer(guestId);
            
            peer.on('open', () => {
                document.getElementById('status-log').innerText = "Misafir olarak girildi (" + rnd + ")";
                startListening();
                connectToOthers(99); // Herkesi ara
            });
        }

        function startListening() {
            peer.on('call', (call) => {
                call.answer(localStream);
                handleStream(call);
            });
        }

        function connectToOthers(mySlot) {
            // İlk 5 kişiyi ara
            for(let i=1; i<=5; i++) {
                if(i === mySlot) continue;
                
                const targetId = myRoom + "_" + i;
                if(!connections[targetId]) {
                    const call = peer.call(targetId, localStream);
                    handleStream(call);
                }
            }
            // 5 saniyede bir tekrar dene
            setTimeout(() => connectToOthers(mySlot), 5000);
        }

        function handleStream(call) {
            call.on('stream', (remoteStream) => {
                // Zaten oynatıyorsak tekrar ekleme
                if(call.peer && connections[call.peer]) return;
                
                const audio = new Audio();
                audio.srcObject = remoteStream;
                audio.play().catch(e => console.log("Otomatik oynatma beklemede"));
                
                connections[call.peer] = true;
                
                // Görsel güncelleme (Basitçe 1. yeşil ışığı yak)
                // Detaylı numara takibi karmaşık olur, sadece biri bağlandı diyelim
                document.getElementById('status-log').innerText = "Bir kullanıcı bağlandı!";
                document.getElementById('u1').classList.add('on');
            });
            
            call.on('close', () => { delete connections[call.peer]; });
            call.on('error', () => {});
        }

        function updateDots(num) {
            // Kendi numaranı mavi yap (eğer 1-5 arasındaysa)
            if(num <= 5) {
                document.getElementById('u' + num).style.border = "2px solid #0af";
            }
        }

        function setupButton() {
            const btn = document.getElementById('ptt-btn');
            btn.innerText = "BAS KONUŞ";
            btn.style.color = "white";

            const start = (e) => {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = true;
                    btn.classList.add('active');
                    btn.innerText = "YAYINDA";
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            };
            const stop = (e) => {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    btn.classList.remove('active');
                    btn.innerText = "BAS KONUŞ";
                }
            };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
            btn.addEventListener('mouseleave', stop);
            btn.addEventListener('touchstart', start, {passive: false});
            btn.addEventListener('touchend', stop, {passive: false});
        }
    </script>
</body>
</html>
