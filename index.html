<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telsiz v13 (Manuel Seçim)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* GİRİŞ VE KOLTUK SEÇİMİ */
        #screen-login { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 20px; z-index: 10; background: #000; }
        
        input { padding: 15px; width: 80%; margin: 10px auto; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 20px; text-align: center; }
        
        .seat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .btn-seat { 
            padding: 20px; background: #333; color: white; border: 2px solid #555; 
            border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold;
        }
        .btn-seat:hover { background: #555; }
        .btn-seat.taken { opacity: 0.5; cursor: not-allowed; background: #220000; }
        
        /* TELSİZ EKRANI */
        #screen-radio { display: none; flex-direction: column; height: 100%; }
        
        /* VİDEO ALANI */
        .video-container {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 10px; flex-grow: 1;
        }
        .video-box {
            width: 30%; height: 120px; background: #000; border-radius: 8px; position: relative; overflow: hidden; border: 2px solid #333;
        }
        @media (max-width: 600px) { .video-box { width: 45%; height: 150px; } }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .label { position: absolute; bottom: 2px; left: 2px; font-size: 12px; background: rgba(0,0,0,0.7); padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        /* Renkli çerçeveler */
        .video-box.me { border-color: #00aaff; box-shadow: 0 0 10px #00aaff; }
        .video-box.talking { border-color: #0f0; box-shadow: 0 0 15px #0f0; }

        /* PTT BUTONU */
        .ptt-wrapper { height: 200px; display: flex; align-items: center; justify-content: center; background: #1a1a1a; border-top: 1px solid #333; }
        #btn-ptt {
            width: 150px; height: 150px; border-radius: 50%;
            background: #333; border: 6px solid #444;
            color: #aaa; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        #btn-ptt.active { background: #d00; color: white; border-color: #f00; box-shadow: 0 0 40px #d00; }
    </style>
</head>
<body>

    <div id="screen-login">
        <h2>Telsiz v13</h2>
        <p style="color:#aaa;">Oda ismi girin:</p>
        <input type="text" id="inp-room" placeholder="Örn: test">
        
        <p style="margin-top:20px; color:#aaa;">Numaranı Seç:</p>
        <div class="seat-grid">
            <button class="btn-seat" onclick="koltukSec(1)">1 (Şef)</button>
            <button class="btn-seat" onclick="koltukSec(2)">2</button>
            <button class="btn-seat" onclick="koltukSec(3)">3</button>
            <button class="btn-seat" onclick="koltukSec(4)">4</button>
            <button class="btn-seat" onclick="koltukSec(5)">5</button>
        </div>
        <div style="font-size: 12px; color: #f90; margin-top: 20px;">
            DİKKAT: Arkadaşınla FARKLI numaraları seçmelisin!
        </div>
    </div>

    <div id="screen-radio">
        <div style="padding:10px; background:#222; font-size:14px;">
            <span id="my-info" style="color:#0af; font-weight:bold;">...</span>
        </div>
        
        <div class="video-container">
            <div class="video-box" id="box-1"><video id="v-1" autoplay playsinline></video><span class="label">User 1</span></div>
            <div class="video-box" id="box-2"><video id="v-2" autoplay playsinline></video><span class="label">User 2</span></div>
            <div class="video-box" id="box-3"><video id="v-3" autoplay playsinline></video><span class="label">User 3</span></div>
            <div class="video-box" id="box-4"><video id="v-4" autoplay playsinline></video><span class="label">User 4</span></div>
            <div class="video-box" id="box-5"><video id="v-5" autoplay playsinline></video><span class="label">User 5</span></div>
        </div>

        <div id="log-txt" style="font-size:10px; color:#666;">Bağlantı bekleniyor...</div>

        <div class="ptt-wrapper">
            <div id="btn-ptt">BAŞLATILIYOR</div>
        </div>
    </div>

    <script>
        var peer = null;
        var localStream = null;
        var mySlot = 0;
        var myRoom = "";
        var connections = {};

        function turkceTemizle(text) {
            return text.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function koltukSec(no) {
            var rawVal = document.getElementById('inp-room').value;
            if(!rawVal) { alert("Önce bir oda ismi yazın!"); return; }
            
            myRoom = turkceTemizle(rawVal);
