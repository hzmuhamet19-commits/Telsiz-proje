<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Telsiz v15</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; text-align: center; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* GİRİŞ EKRANI */
        #login-panel { display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 10px; z-index: 10; background: #000; }
        
        input { 
            padding: 15px; width: 80%; margin: 0 auto 20px auto; 
            border-radius: 10px; border: 2px solid #007bff; 
            background: #222; color: white; font-size: 20px; text-align: center; 
        }
        
        .grid-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        
        .btn-big { 
            padding: 25px; background: #1b5e20; color: white; 
            border: 2px solid #4caf50; border-radius: 10px; 
            font-size: 18px; cursor: pointer; font-weight: bold;
        }
        
        /* TELSİZ EKRANI */
        #radio-panel { display: none; flex-direction: column; height: 100%; }
        
        .video-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding: 5px; flex-grow: 1; align-content: flex-start; }
        
        .vid-box { 
            width: 45%; height: 120px; background: #111; border: 1px solid #333; position: relative; 
            display: flex; align-items: center; justify-content: center;
        }
        
        /* DONMAYI ENGELLEYEN CSS AYARI: Görüntü küçük olsun */
        video { 
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); 
            filter: contrast(1.2); /* Düşük kaliteyi netleştir */
        }
        
        .vid-box.talking { border: 3px solid #0f0; }
        .label { position: absolute; bottom: 0; left: 0; background: rgba(0,0,0,0.7); font-size: 10px; padding: 2px; }

        /* BUTON */
        .ptt-zone { height: 200px; display: flex; align-items: center; justify-content: center; background: #111; border-top: 2px solid #333; }
        #main-btn {
            width: 150px; height: 150px; border-radius: 50%;
            background: #333; border: 5px solid #555;
            color: #aaa; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        #main-btn.active { background: #d00; border-color: red; color: white; }
    </style>
</head>
<body>

    <div id="login-panel">
        <h3 style="color:#0af;">Oda Adı:</h3>
        <input type="text" id="room-input" placeholder="test99">
        
        <p style="color:#aaa; font-size:12px;">Numaranı Seç:</p>
        <div class="grid-buttons">
            <button class="btn-big" onclick="sec(1)">1. Kişi</button>
            <button class="btn-big" onclick="sec(2)">2. Kişi</button>
            <button class="btn-big" onclick="sec(3)">3. Kişi</button>
            <button class="btn-big" onclick="sec(4)">4. Kişi</button>
        </div>
        <div style="color:#666; font-size:10px; margin-top:10px;">Düşük Veri Modu Aktif</div>
    </div>

    <div id="radio-panel">
        <div style="padding:5px; background:#222; color:#0af; font-size:12px; font-weight:bold;" id="header-info">...</div>
        
        <div class="video-grid">
            <div class="vid-box" id="b1"><video id="v1" autoplay playsinline></video><span class="label">1</span></div>
            <div class="vid-box" id="b2"><video id="v2" autoplay playsinline></video><span class="label">2</span></div>
            <div class="vid-box" id="b3"><video id="v3" autoplay playsinline></video><span class="label">3</span></div>
            <div class="vid-box" id="b4"><video id="v4" autoplay playsinline></video><span class="label">4</span></div>
        </div>
        
        <div style="text-align:center;">
            <button onclick="location.reload()" style="background:#333; color:#fff; border:none; padding:5px 10px; font-size:10px;">Donarsa Buraya Bas (Yenile)</button>
        </div>

        <div class="ptt-zone">
            <div id="main-btn">BAŞLATILIYOR</div>
        </div>
    </div>

    <script>
        var peer, localStream, mySlot, myRoom;
        var conns = {};

        function sec(no) {
            var inputVal = document.getElementById('room-input').value;
            if(!inputVal) inputVal = "test"; 

            myRoom = inputVal.toLowerCase().replace(/[^a-z0-9]/g, '');
            mySlot = no;

            // --- PERFORMANS AYARI BURADA ---
            // width: 240 -> Çok küçük ama çok hızlı
            // frameRate: 15 -> Akıcı değil ama donmaz
            var videoConstraints = {
                width: { ideal: 240 },
                height: { ideal: 180 },
                frameRate: { ideal: 15, max: 15 },
                facingMode: "user"
            };

            navigator.mediaDevices.getUserMedia({ audio: true, video: videoConstraints })
            .then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('radio-panel').style.display = 'flex';
                document.getElementById('header-info').innerText = "Oda: " + myRoom + " | Ben: #" + no;

                baslatPeer();
                butonAyarla();
            })
            .catch(function(err) {
                alert("Kamera hatası: " + err);
                location.reload();
            });
        }

        function baslatPeer() {
            var id = myRoom + "_" + mySlot;
            // Peer ayarları (Hız için)
            peer = new Peer(id, {
                debug: 0,
                config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] } 
            });

            peer.on('open', function() {
                var v = document.getElementById('v' + mySlot);
                v.srcObject = localStream;
                v.muted = true;
                document.getElementById('b' + mySlot).style.border = "3px solid #0af";

                var btn = document.getElementById('main-btn');
                btn.innerText = "BAS KONUŞ";
                btn.style.color = "white";

                peer.on('call', function(c) { c.answer(localStream); bagla(c); });
                ara();
            });

            peer.on('error', function(err) {
                if(err.type == 'unavailable-id') {
                    alert("Bu numara dolu! Başkasını seç.");
                    location.reload();
                }
            });
        }

        function ara() {
            for(var i=1; i<=4; i++) {
                if(i == mySlot) continue;
                var target = myRoom + "_" + i;
                if(!conns[target]) {
                    try { var c = peer.call(target, localStream); if(c) bagla(c, i); } catch(e){}
                }
            }
            setTimeout(ara, 4000); // Taramayı yavaşlattım (CPU tasarrufu)
        }

        function bagla(call, manuelNo) {
            var slot = manuelNo;
            if(!slot && call.peer) slot = parseInt(call.peer.split('_').pop());

            call.on('stream', function(rs) {
                if(!conns[call.peer]) {
                    var v = document.getElementById('v' + slot);
                    if(v) { 
                        v.srcObject = rs; 
                        sesAnaliz(rs, document.getElementById('b'+slot));
                    }
                    conns[call.peer] = true;
                }
            });
            call.on('close', function() { delete conns[call.peer]; });
            call.on('error', function(){});
        }

        function sesAnaliz(stream, box) {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var src = ctx.createMediaStreamSource(stream);
                var anl = ctx.createAnalyser();
                anl.fftSize = 32;
                src.connect(anl);
                var data = new Uint8Array(anl.frequencyBinCount);
                function loop() {
                    if(!box) return;
                    anl.getByteFrequencyData(data);
                    var sum = 0;
                    for(var i=0; i<data.length; i++) sum += data[i];
                    if((sum/data.length)>10) box.classList.add('talking');
                    else box.classList.remove('talking');
                    requestAnimationFrame(loop);
                }
                loop();
            }catch(e){}
        }

        function butonAyarla() {
            var btn = document.getElementById('main-btn');
            var myBox = document.getElementById('b' + mySlot);
            
            function bas(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = true;
                    btn.classList.add('active');
                    btn.innerText = "YAYINDA";
                    if(myBox) myBox.classList.add('talking');
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            }
            function cek(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    btn.classList.remove('active');
                    btn.innerText = "BAS KONUŞ";
                    if(myBox) myBox.classList.remove('talking');
                }
            }
            btn.addEventListener('mousedown', bas);
            btn.addEventListener('mouseup', cek);
            btn.addEventListener('touchstart', bas, {passive:false});
            btn.addEventListener('touchend', cek, {passive:false});
        }
    </script>
</body>
</html>
