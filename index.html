<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grup Telsizi (5 Kişi)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 10px; display: flex; flex-direction: column; height: 95vh; }
        .header { margin-bottom: 10px; }
        .status-box { background: #333; padding: 10px; border-radius: 5px; font-size: 0.85em; display: flex; justify-content: space-around; flex-wrap: wrap; }
        .peer-item { padding: 5px 10px; margin: 2px; border-radius: 4px; background: #555; opacity: 0.5; }
        .peer-item.connected { background: #28a745; opacity: 1; font-weight: bold; color: white; }
        
        /* Büyük PTT Butonu */
        .ptt-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .btn-ptt { 
            width: 80vw; height: 80vw; max-width: 300px; max-height: 300px;
            border-radius: 50%; border: 8px solid #444;
            background: #333; color: #aaa; font-size: 1.5em; font-weight: bold;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); outline: none;
            transition: all 0.1s;
        }
        .btn-ptt.active { background: #e74c3c; color: white; border-color: #c0392b; box-shadow: 0 0 40px #e74c3c; transform: scale(0.95); }
        .btn-ptt:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .setup-screen { display: none; margin-top: 50px; }
        .setup-screen.visible { display: block; }
        input, select { padding: 10px; border-radius: 5px; border: none; margin: 5px; width: 80%; }
        button.start-btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 80%; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="setup" class="setup-screen">
        <h2>Telsiz Kurulum</h2>
        <input type="text" id="roomInput" placeholder="Oda Adı (Örn: insaat)">
        <select id="userInput">
            <option value="1">Kullanıcı 1 (Şef)</option>
            <option value="2">Kullanıcı 2</option>
            <option value="3">Kullanıcı 3</option>
            <option value="4">Kullanıcı 4</option>
            <option value="5">Kullanıcı 5</option>
        </select>
        <button class="start-btn" onclick="manualStart()">GİRİŞ YAP</button>
        <p style="font-size:0.8em; color:#888;">veya linkin sonuna ?oda=x&no=1 ekleyin.</p>
    </div>

    <div id="radio-ui" style="display:none; height:100%; flex-direction:column;">
        <div class="header">
            <h3 id="room-display" style="margin:5px 0; color:#00ffcc">...</h3>
            <div class="status-box" id="peers-list">
                <span id="p1" class="peer-item">1</span>
                <span id="p2" class="peer-item">2</span>
                <span id="p3" class="peer-item">3</span>
                <span id="p4" class="peer-item">4</span>
                <span id="p5" class="peer-item">5</span>
            </div>
        </div>

        <div class="ptt-container">
            <button id="ptt-btn" class="btn-ptt" disabled>BAĞLANIYOR</button>
        </div>
        <p id="log" style="color:#666; font-size:0.7em; margin-top: auto;">Sistem Hazır.</p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let roomName = params.get('oda');
        let myNo = parseInt(params.get('no'));
        
        let peer;
        let localStream;
        let connections = {}; // Aktif bağlantılar
        const maxUsers = 5;

        // Eğer URL'de bilgi yoksa Setup ekranını göster
        if (!roomName || !myNo) {
            document.getElementById('setup').classList.add('visible');
        } else {
            initRadio();
        }

        function manualStart() {
            const r = document.getElementById('roomInput').value.trim();
            const u = document.getElementById('userInput').value;
            if(!r) return alert("Oda adı girin!");
            window.location.href = ?oda=${r}&no=${u};
        }

        function initRadio() {
            document.getElementById('radio-ui').style.display = 'flex';
            document.getElementById('setup').style.display = 'none';
            document.getElementById('room-display').innerText = Oda: ${roomName} | Ben: #${myNo};
            
            // Kendi numaramızı listede mavi yapalım
            document.getElementById(p${myNo}).style.background = '#007bff';
            document.getElementById(p${myNo}).style.opacity = '1';

            // ID Formatı: odaadi_numara (Örn: insaat_1)
            const myPeerId = ${roomName}_${myNo};
            
            peer = new Peer(myPeerId);

            // 1. Mikrofonu Al
            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false; // Başta sessiz
                activatePTT();
                
                // Diğer herkesi bulmaya çalış (Mesh Network)
                connectToOthers();

            }).catch(err => {
                document.getElementById('ptt-btn').innerText = "MİKROFON HATASI";
                document.getElementById('ptt-btn').style.borderColor = "red";
            });

            // 2. Gelen Aramaları Cevapla
            peer.on('call', (call) => {
                call.answer(localStream);
                setupCallEvents(call);
            });

            peer.on('error', err => console.log(err));
        }

        // Diğer kullanıcıları sürekli dene (Otomatik Bağlantı)
        function connectToOthers() {
            for (let i = 1; i <= maxUsers; i++) {
                if (i === myNo) continue; // Kendini arama
                
                const targetId = ${roomName}_${i};
                
                // Eğer zaten bağlı değilsek bağlanmayı dene
                if (!connections[targetId]) {
                    const call = peer.call(targetId, localStream);
                    setupCallEvents(call, i);
                }
            }
            // 5 saniyede bir kopan veya yeni gelen var mı diye kontrol et
            setTimeout(connectToOthers, 5000);
        }

        function setupCallEvents(call, userNo) {
            const peerId = call.peer;
            // ID'den numarayı çıkar (insaat_2 -> 2)
            const no = userNo || parseInt(peerId.split('_').pop());

            call.on('stream', (remoteStream) => {
                // Eğer bu kişi için zaten audio elementi yoksa oluştur
                if (!document.getElementById(audio_${no})) {
                    const audio = new Audio();
                    audio.id = audio_${no};
                    audio.srcObject = remoteStream;
                    audio.play();
                    
                    // Arayüzde yeşil yak
                    const badge = document.getElementById(p${no});
                    if(badge) badge.classList.add('connected');
                    
                    connections[peerId] = true;
                    document.getElementById('log').innerText = #${no} Bağlandı.;
                }
            });

            call.on('close', () => {
                document.getElementById(p${no}).classList.remove('connected');
                delete connections[peerId];
                const audio = document.getElementById(audio_${no});
                if(audio) audio.remove();
            });
            
            call.on('error', () => { /* Bağlantı hatası (henüz online değil) */ });
        }

        // PTT (Bas Konuş) Mantığı
        const pttBtn = document.getElementById('ptt-btn');

        function activatePTT() {
            pttBtn.disabled = false;
            pttBtn.innerText = "BAS KONUŞ";
            pttBtn.style.color = "white";
        }

        const startTalk = (e) => {
            e.preventDefault();
            if(!localStream) return;
            localStream.getAudioTracks()[0].enabled = true;
            pttBtn.classList.add('active');
            pttBtn.innerText = "YAYINDA";
        };

        const stopTalk = (e) => {
            e.preventDefault();
            if(!localStream) return;
            localStream.getAudioTracks()[0].enabled = false;
            pttBtn.classList.remove('active');
            pttBtn.innerText = "BAS KONUŞ";
        };

        // Event Listener'lar
        pttBtn.addEventListener('mousedown', startTalk);
        pttBtn.addEventListener('mouseup', stopTalk);
        pttBtn.addEventListener('mouseleave', stopTalk);
        pttBtn.addEventListener('touchstart', startTalk, {passive: false});
        pttBtn.addEventListener('touchend', stopTalk, {passive: false});
    </script>
</body>
</html>
