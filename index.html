<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Telsiz v16</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* MODERN RESET VE FONTLAR */
        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; margin: 0; display: flex; flex-direction: column; 
            height: 100vh; overflow: hidden; 
        }

        /* GİRİŞ EKRANI TASARIMI */
        #login-panel { 
            display: flex; flex-direction: column; justify-content: center; 
            height: 100%; padding: 20px; z-index: 10; 
            backdrop-filter: blur(10px);
        }
        
        h2 { 
            font-weight: 300; letter-spacing: 2px; text-transform: uppercase; 
            margin-bottom: 30px; color: #00d2ff; text-shadow: 0 0 10px rgba(0,210,255,0.5);
        }

        /* Şık Input Alanı */
        input { 
            padding: 15px; width: 100%; max-width: 300px; margin: 0 auto 30px auto; 
            border-radius: 50px; border: 2px solid rgba(255,255,255,0.1); 
            background: rgba(255,255,255,0.05); color: white; 
            font-size: 20px; text-align: center; transition: 0.3s;
        }
        input:focus { border-color: #00d2ff; background: rgba(255,255,255,0.1); }
        
        /* Koltuk Seçim Butonları */
        .grid-buttons { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; 
            max-width: 400px; margin: 0 auto;
        }
        
        .btn-big { 
            padding: 20px; 
            background: rgba(255, 255, 255, 0.05); 
            color: #ccc; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 15px; 
            font-size: 16px; cursor: pointer; font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-big:active { transform: scale(0.95); }
        .btn-big:hover { background: rgba(255,255,255,0.1); color: white; border-color: #00d2ff; }
        
        /* TELSİZ EKRANI */
        #radio-panel { display: none; flex-direction: column; height: 100%; }
        
        /* Üst Bilgi Barı */
        .top-bar {
            padding: 15px; background: rgba(0,0,0,0.3); 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center;
        }
        .room-badge { 
            background: rgba(0, 210, 255, 0.2); color: #00d2ff; 
            padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;
        }
        .refresh-btn {
            background: none; border: 1px solid rgba(255,255,255,0.2); 
            color: #aaa; padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer;
        }

        /* Video Grid */
        .video-grid { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; 
            padding: 10px; flex-grow: 1; align-content: flex-start; overflow-y: auto;
        }
        
        .vid-box { 
            width: 48%; height: 130px; 
            background: rgba(0,0,0,0.3); border-radius: 12px; 
            position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        
        video { 
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); 
            filter: contrast(1.1);
        }
        
        /* Konuşma Efekti */
        .vid-box.talking { 
            border-color: #00ff88; 
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); 
        }
        
        .label { 
            position: absolute; bottom: 5px; left: 5px; 
            background: rgba(0,0,0,0.6); color: white;
            font-size: 10px; padding: 3px 8px; border-radius: 10px;
            backdrop-filter: blur(2px);
        }

        /* ALT KONTROL ALANI */
        .ptt-zone { 
            height: 240px; 
            display: flex; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.2); 
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* ANİMASYONLU PTT BUTONU */
        #main-btn {
            width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle, #3a3a3a, #1a1a1a);
            border: 4px solid #444;
            color: #888; font-size: 20px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            user-select: none; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 5px 10px rgba(255,255,255,0.05);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        
        /* Basıldığında */
        #main-btn.active { 
            background: radial-gradient(circle, #ff4b1f, #ff9068);
            border-color: #ff4b1f; 
            color: white; 
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 75, 31, 0.6);
        }
        
        /* Pulse Animasyonu (Arkada halka büyümesi) */
        #main-btn.active::after {
            content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border-radius: 50%; border: 2px solid #ff4b1f;
            animation: pulse 1s infinite; opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

    </style>
</head>
<body>

    <div id="login-panel">
        <h2>Telsiz Giriş</h2>
        
        <input type="text" id="room-input" placeholder="Oda Adı (Örn: ekip99)">
        
        <p style="color:rgba(255,255,255,0.5); font-size:12px; margin-bottom:15px;">KİMLİĞİNİ SEÇ</p>
        <div class="grid-buttons">
            <button class="btn-big" onclick="sec(1)">1. Yönetici</button>
            <button class="btn-big" onclick="sec(2)">2. Saha</button>
            <button class="btn-big" onclick="sec(3)">3. Saha</button>
            <button class="btn-big" onclick="sec(4)">4. Merkez</button>
        </div>
    </div>

    <div id="radio-panel">
        <div class="top-bar">
            <div id="header-info" class="room-badge">...</div>
            <button class="refresh-btn" onclick="location.reload()">Sorun varsa yenile ↻</button>
        </div>
        
        <div class="video-grid">
            <div class="vid-box" id="b1"><video id="v1" autoplay playsinline></video><span class="label">1</span></div>
            <div class="vid-box" id="b2"><video id="v2" autoplay playsinline></video><span class="label">2</span></div>
            <div class="vid-box" id="b3"><video id="v3" autoplay playsinline></video><span class="label">3</span></div>
            <div class="vid-box" id="b4"><video id="v4" autoplay playsinline></video><span class="label">4</span></div>
        </div>
        
        <div class="ptt-zone">
            <div id="main-btn">BAŞLATILIYOR</div>
        </div>
    </div>

    <script>
        var peer, localStream, mySlot, myRoom;
        var conns = {};

        function sec(no) {
            var inputVal = document.getElementById('room-input').value;
            if(!inputVal) inputVal = "test"; 

            myRoom = inputVal.toLowerCase().replace(/[^a-z0-9]/g, '');
            mySlot = no;

            // Performans ayarları (Donmama için)
            var videoConstraints = {
                width: { ideal: 240 },
                height: { ideal: 180 },
                frameRate: { ideal: 15, max: 15 },
                facingMode: "user"
            };

            navigator.mediaDevices.getUserMedia({ audio: true, video: videoConstraints })
            .then(function(stream) {
                localStream = stream;
                localStream.getAudioTracks()[0].enabled = false;
                
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('radio-panel').style.display = 'flex';
                document.getElementById('header-info').innerText = myRoom.toUpperCase() + " | #" + no;

                baslatPeer();
                butonAyarla();
            })
            .catch(function(err) {
                alert("Kamera hatası: " + err);
                location.reload();
            });
        }

        function baslatPeer() {
            var id = myRoom + "_" + mySlot;
            peer = new Peer(id, {
                debug: 0,
                config: { 'iceServers': [ { urls: 'stun:stun.l.google.com:19302' } ] } 
            });

            peer.on('open', function() {
                var v = document.getElementById('v' + mySlot);
                v.srcObject = localStream;
                v.muted = true;
                // Kendi kutumuzun kenarını mavi yapalım
                document.getElementById('b' + mySlot).style.borderColor = "#00d2ff";

                var btn = document.getElementById('main-btn');
                btn.innerText = "BAS KONUŞ";
                btn.style.color = "#ccc";

                peer.on('call', function(c) { c.answer(localStream); bagla(c); });
                ara();
            });

            peer.on('error', function(err) {
                if(err.type == 'unavailable-id') {
                    alert("Bu numara dolu! Başkasını seç.");
                    location.reload();
                }
            });
        }

        function ara() {
            for(var i=1; i<=4; i++) {
                if(i == mySlot) continue;
                var target = myRoom + "_" + i;
                if(!conns[target]) {
                    try { var c = peer.call(target, localStream); if(c) bagla(c, i); } catch(e){}
                }
            }
            setTimeout(ara, 4000); 
        }

        function bagla(call, manuelNo) {
            var slot = manuelNo;
            if(!slot && call.peer) slot = parseInt(call.peer.split('_').pop());

            call.on('stream', function(rs) {
                if(!conns[call.peer]) {
                    var v = document.getElementById('v' + slot);
                    if(v) { 
                        v.srcObject = rs; 
                        sesAnaliz(rs, document.getElementById('b'+slot));
                    }
                    conns[call.peer] = true;
                }
            });
            call.on('close', function() { delete conns[call.peer]; });
            call.on('error', function(){});
        }

        function sesAnaliz(stream, box) {
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                var src = ctx.createMediaStreamSource(stream);
                var anl = ctx.createAnalyser();
                anl.fftSize = 32;
                src.connect(anl);
                var data = new Uint8Array(anl.frequencyBinCount);
                function loop() {
                    if(!box) return;
                    anl.getByteFrequencyData(data);
                    var sum = 0;
                    for(var i=0; i<data.length; i++) sum += data[i];
                    if((sum/data.length)>10) box.classList.add('talking');
                    else box.classList.remove('talking');
                    requestAnimationFrame(loop);
                }
                loop();
            }catch(e){}
        }

        function butonAyarla() {
            var btn = document.getElementById('main-btn');
            var myBox = document.getElementById('b' + mySlot);
            
            function bas(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = true;
                    btn.classList.add('active');
                    btn.innerText = "YAYINDA";
                    if(myBox) myBox.classList.add('talking');
                    if(navigator.vibrate) navigator.vibrate(50);
                }
            }
            function cek(e) {
                if(e.cancelable) e.preventDefault();
                if(localStream) {
                    localStream.getAudioTracks()[0].enabled = false;
                    btn.classList.remove('active');
                    btn.innerText = "BAS KONUŞ";
                    if(myBox) myBox.classList.remove('talking');
                }
            }
            btn.addEventListener('mousedown', bas);
            btn.addEventListener('mouseup', cek);
            btn.addEventListener('touchstart', bas, {passive:false});
            btn.addEventListener('touchend', cek, {passive:false});
        }
    </script>
</body>
</html>
