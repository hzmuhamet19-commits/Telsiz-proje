<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kolay Telsiz</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #2c3e50; color: white; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        
        /* Kart Tasarımı */
        .card { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; width: 90%; max-width: 350px; }
        
        input { width: 70%; padding: 10px; border-radius: 5px; border: none; text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        
        /* Butonlar */
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; margin: 5px; }
        .btn-green { background: #27ae60; }
        .btn-blue { background: #2980b9; }

        /* ID Göstergesi */
        .my-id-box { background: #fff; color: #333; padding: 10px; border-radius: 5px; margin: 10px 0; font-family: monospace; font-size: 18px; border: 2px dashed #e67e22; word-break: break-all;}

        /* Telsiz Ekranı */
        #radio-screen { display: none; }
        
        /* BAS KONUŞ BUTONU */
        #ptt-btn { 
            width: 200px; height: 200px; border-radius: 50%; 
            background: #c0392b; border: 8px solid #96281b; 
            color: white; font-size: 24px; font-weight: bold; 
            margin-top: 20px; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            user-select: none; -webkit-tap-highlight-color: transparent;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #ptt-btn:active, #ptt-btn.talking { background: #2ecc71; border-color: #27ae60; transform: scale(0.95); }
        
        .status { margin-top: 15px; font-size: 14px; color: #bdc3c7; }
    </style>
</head>
<body>

    <div id="login-screen" class="card">
        <h2><i class="fas fa-satellite-dish"></i> Bağlantı Kur</h2>
        
        <p>Senin Numaran:</p>
        <div class="my-id-box" id="my-id">Yükleniyor...</div>
        <p style="font-size:12px; color:#bdc3c7;">Bu numarayı arkadaşına ver.</p>
        
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 20px 0;">

        <p>Arkadaşının Numarası:</p>
        <input type="text" id="friend-id" placeholder="Onun numarasını buraya gir">
        <button class="btn btn-green" onclick="connectToFriend()">BAĞLAN</button>
    </div>

    <div id="radio-screen">
        <h3><i class="fas fa-walkie-talkie"></i> Telsiz Hattı</h3>
        <div class="status" id="connection-status">Bağlandı!</div>
        
        <button id="ptt-btn">
            <i class="fas fa-microphone" style="font-size:40px; margin-bottom:10px;"></i>
            <span>BAS KONUŞ</span>
        </button>
        
        <br>
        <button class="btn btn-blue" onclick="location.reload()">Kapat</button>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        let peer = null;
        let conn = null;
        let localStream = null;
        let currentCall = null;
        
        // 1. PeerJS Başlat (Rastgele ID alır)
        function init() {
            peer = new Peer(); // Hiçbir ayar yok, otomatik cloud server

            peer.on('open', (id) => {
                document.getElementById('my-id').innerText = id;
            });

            // Biri bizi ararsa
            peer.on('call', (call) => {
                navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                    localStream = stream;
                    muteMic(); // Başta sessiz
                    call.answer(stream); // Cevap ver
                    setupCall(call);
                    showRadioScreen();
                });
            });

            peer.on('error', (err) => {
                alert("Hata: " + err.type);
            });
        }

        // 2. Biz birini ararsak
        function connectToFriend() {
            const friendId = document.getElementById('friend-id').value.trim();
            if (!friendId) return alert("Arkadaşının numarasını girmelisin!");

            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                localStream = stream;
                muteMic(); // Başta sessiz
                const call = peer.call(friendId, stream);
                setupCall(call);
                showRadioScreen();
            }).catch(err => {
                alert("Mikrofon izni vermen lazım!");
            });
        }

        // 3. Çağrı Kurulumu (Ses gelip gitmesi)
        function setupCall(call) {
            currentCall = call;
            call.on('stream', (remoteStream) => {
                const audioEl = document.getElementById('remote-audio');
                audioEl.srcObject = remoteStream;
                audioEl.play().catch(e => console.log("Oynatma hatası, ekrana dokun"));
                document.getElementById('connection-status').innerText = "Ses Hattı Açık 🟢";
            });
            
            call.on('close', () => {
                alert("Bağlantı koptu");
                location.reload();
            });
        }

        // 4. Bas Konuş Mantığı
        function setupPTT() {
            const btn = document.getElementById('ptt-btn');
            const status = document.getElementById('connection-status');

            const startTalk = (e) => {
                e.preventDefault();
                if (localStream) {
                    localStream.getAudioTracks()[0].enabled = true; // Sesi aç
                    btn.classList.add('talking');
                    btn.querySelector('span').innerText = "KONUŞUYOR";
                    status.innerText = "Sesin gidiyor... 🔊";
                }
            };

            const stopTalk = (e) => {
                e.preventDefault();
                if (localStream) {
                    localStream.getAudioTracks()[0].enabled = false; // Sesi kapat
                    btn.classList.remove('talking');
                    btn.querySelector('span').innerText = "BAS KONUŞ";
                    status.innerText = "Dinlemede 👂";
                }
            };

            btn.addEventListener('mousedown', startTalk);
            btn.addEventListener('mouseup', stopTalk);
            btn.addEventListener('touchstart', startTalk, {passive: false});
            btn.addEventListener('touchend', stopTalk, {passive: false});
        }

        function showRadioScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('radio-screen').style.display = 'block';
        }

        function muteMic() {
            if(localStream) localStream.getAudioTracks()[0].enabled = false;
        }

        // Başlat
        init();
        setupPTT();

    </script>
</body>
</html>
